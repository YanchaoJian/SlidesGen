<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  
  <rect width="1280" height="720" fill="#F8F9FA" />
  
  
  <defs>
    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E9ECEF" />
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#dotGrid)" />

  
  <rect x="0" y="0" width="1280" height="80" fill="#FFFFFF" />
  <rect x="0" y="78" width="1280" height="2" fill="#003D7C" />
  
  
  <polygon points="60,20 100,20 85,60 45,60" fill="#003D7C" />
  <line x1="63" y1="32" x2="90" y2="32" stroke="#FFFFFF" stroke-width="2" />
  <line x1="60" y1="40" x2="87" y2="40" stroke="#FFFFFF" stroke-width="2" />
  <line x1="57" y1="48" x2="84" y2="48" stroke="#FFFFFF" stroke-width="2" />

  
  <text x="120" y="52" font-family="Microsoft YaHei, Arial" font-size="32" font-weight="bold" fill="#003D7C">Background: Sequence Transduction is Fundamental to AI</text>

  
  <polygon points="1160,15 1200,15 1200,45 1180,60 1160,45" fill="#003D7C" />
  <text x="1180" y="40" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF">DUT</text>

  
  <path fill="#003D7C" fill-opacity="0.08" d="M44,95 H1236 A4,4 0 0 1 1240,99 V141 A4,4 0 0 1 1236,145 H44 A4,4 0 0 1 40,141 V99 A4,4 0 0 1 44,95 Z" />
  <text x="640" y="127" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="bold" fill="#003D7C">
    RNNs (LSTMs/GRUs) dominated sequence modeling through sequential processing, but this design now limits computational scaling.
  </text>

  
  
  
  <path fill="#003D7C" d="M48,170 H617 A8,8 0 0 1 625,178 V392 A8,8 0 0 1 617,400 H48 A8,8 0 0 1 40,392 V178 A8,8 0 0 1 48,170 Z" />
  <text x="332" y="225" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="bold" fill="#FFFFFF">CORE APPLICATIONS</text>
  <line x1="280" y1="240" x2="385" y2="240" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" />
  <text x="332" y="285" text-anchor="middle" font-family="Microsoft YaHei, Calibri" font-size="19" fill="#FFFFFF">Sequence transduction is the core engine</text>
  <text x="332" y="320" text-anchor="middle" font-family="Microsoft YaHei, Calibri" font-size="19" fill="#FFFFFF">behind Language Modeling and</text>
  <text x="332" y="355" text-anchor="middle" font-family="Microsoft YaHei, Calibri" font-size="19" fill="#FFFFFF">Machine Translation tasks.</text>

  
  <path fill="#003D7C" d="M663,170 H1232 A8,8 0 0 1 1240,178 V392 A8,8 0 0 1 1232,400 H663 A8,8 0 0 1 655,392 V178 A8,8 0 0 1 663,170 Z" />
  <text x="947" y="225" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="bold" fill="#FFFFFF">HISTORICAL STANDARD</text>
  <line x1="895" y1="240" x2="1000" y2="240" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" />
  <text x="947" y="285" text-anchor="middle" font-family="Microsoft YaHei, Calibri" font-size="19" fill="#FFFFFF">The field has been dominated by</text>
  <text x="947" y="320" text-anchor="middle" font-family="Microsoft YaHei, Calibri" font-size="19" fill="#FFFFFF">Recurrent Neural Networks (RNNs),</text>
  <text x="947" y="355" text-anchor="middle" font-family="Microsoft YaHei, Calibri" font-size="19" fill="#FFFFFF">specifically LSTMs and GRUs.</text>

  
  <path fill="#003D7C" d="M48,425 H617 A8,8 0 0 1 625,433 V647 A8,8 0 0 1 617,655 H48 A8,8 0 0 1 40,647 V433 A8,8 0 0 1 48,425 Z" />
  <text x="332" y="480" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="bold" fill="#FFFFFF">SEQUENTIAL PROCESS</text>
  <line x1="280" y1="495" x2="385" y2="495" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" />
  <text x="332" y="540" text-anchor="middle" font-family="Microsoft YaHei, Calibri" font-size="19" fill="#FFFFFF">Models maintain a hidden state that</text>
  <text x="332" y="575" text-anchor="middle" font-family="Microsoft YaHei, Calibri" font-size="19" fill="#FFFFFF">evolves with each input symbol,</text>
  <text x="332" y="610" text-anchor="middle" font-family="Microsoft YaHei, Calibri" font-size="19" fill="#FFFFFF">processing data step-by-step.</text>

  
  <path fill="#0056A6" stroke="#FFFFFF" stroke-width="2" d="M663,425 H1232 A8,8 0 0 1 1240,433 V647 A8,8 0 0 1 1232,655 H663 A8,8 0 0 1 655,647 V433 A8,8 0 0 1 663,425 Z" />
  <text x="947" y="480" text-anchor="middle" font-family="Microsoft YaHei, Arial" font-size="24" font-weight="bold" fill="#FFFFFF">SCALING LIMITATION</text>
  <line x1="895" y1="495" x2="1000" y2="495" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5" />
  <text x="947" y="540" text-anchor="middle" font-family="Microsoft YaHei, Calibri" font-size="19" font-weight="bold" fill="#FFFFFF">The sequential nature creates a</text>
  <text x="947" y="575" text-anchor="middle" font-family="Microsoft YaHei, Calibri" font-size="19" font-weight="bold" fill="#FFFFFF">significant bottleneck for modern</text>
  <text x="947" y="610" text-anchor="middle" font-family="Microsoft YaHei, Calibri" font-size="19" font-weight="bold" fill="#FFFFFF">large-scale AI model training.</text>

  
  <line x1="40" y1="685" x2="1240" y2="685" stroke="#003D7C" stroke-width="1" stroke-opacity="0.5" />
  <text x="40" y="708" font-family="Microsoft YaHei, Arial" font-size="14" fill="#808080">Dalian University of Technology | Research Presentation</text>
  <text x="1240" y="708" text-anchor="end" font-family="Arial" font-size="14" fill="#808080">02 / 17</text>
</svg>