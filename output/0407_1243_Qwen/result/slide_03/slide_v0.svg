<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  
  <rect width="1280" height="720" fill="#FFFFFF" />

  
  <rect x="0" y="0" width="1280" height="6" fill="#005587" />

  
  <text x="640" y="100" text-anchor="middle" font-size="36" font-weight="bold" fill="#005587" font-family="Microsoft YaHei, SimSun, sans-serif">
    Sequential Computation Limits Model Efficiency
  </text>

  
  <path fill="#E6F0FA" d="M48,120 H1232 A8,8 0 0 1 1240,128 V157 A8,8 0 0 1 1232,165 H48 A8,8 0 0 1 40,157 V128 A8,8 0 0 1 48,120 Z" />
  <text x="640" y="150" text-anchor="middle" font-size="18" fill="#005587" font-family="Microsoft YaHei, SimSun, sans-serif">
    Sequential processing creates fundamental bottlenecks in model scalability and resource usage.
  </text>

  
  
  <path fill="#FFFFFF" stroke="#005587" stroke-width="1" d="M52,190 H401 A12,12 0 0 1 413,202 V538 A12,12 0 0 1 401,550 H52 A12,12 0 0 1 40,538 V202 A12,12 0 0 1 52,190 Z" />
  <path fill="#005587" d="M52,190 H401 A12,12 0 0 1 413,202 V233 A12,12 0 0 1 401,245 H52 A12,12 0 0 1 40,233 V202 A12,12 0 0 1 52,190 Z" />
  <text x="226" y="222" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, SimSun, sans-serif">
    Core Issues
  </text>
  <text fill="#000000" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="271.6">• RNNs cannot parallelize within training</text><text fill="#000000" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="273.2">  examples due to sequential nature.</text><text fill="#000000" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="274.8">• Memory limits batching at long</text><text fill="#000000" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="276.4">  sequence lengths.</text><path fill="#FFFFFF" stroke="#005587" stroke-width="1" d="M465,190 H814 A12,12 0 0 1 826,202 V538 A12,12 0 0 1 814,550 H465 A12,12 0 0 1 453,538 V202 A12,12 0 0 1 465,190 Z" />
  <path fill="#005587" d="M465,190 H814 A12,12 0 0 1 826,202 V233 A12,12 0 0 1 814,245 H465 A12,12 0 0 1 453,233 V202 A12,12 0 0 1 465,190 Z" />
  <text x="639" y="222" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, SimSun, sans-serif">
    Architectural Gaps
  </text>
  <text fill="#000000" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="473" y="271.6">• Convolutional models scale with</text><text fill="#000000" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="473" y="273.2">  distance between positions.</text><text fill="#000000" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="473" y="274.8">• Difficulty learning long-range</text><text fill="#000000" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="473" y="276.4">  dependencies.</text><path fill="#FFFFFF" stroke="#005587" stroke-width="1" d="M878,190 H1227 A12,12 0 0 1 1239,202 V538 A12,12 0 0 1 1227,550 H878 A12,12 0 0 1 866,538 V202 A12,12 0 0 1 878,190 Z" />
  <path fill="#005587" d="M878,190 H1227 A12,12 0 0 1 1239,202 V233 A12,12 0 0 1 1227,245 H878 A12,12 0 0 1 866,233 V202 A12,12 0 0 1 878,190 Z" />
  <text x="1052" y="222" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, SimSun, sans-serif">
    Resource Costs
  </text>
  <text fill="#000000" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="886" y="271.6">• State-of-the-art models demand</text><text fill="#000000" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="886" y="273.2">  extensive compute time.</text><text fill="#000000" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="886" y="274.8">• Ensembles multiply costs for</text><text fill="#000000" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="886" y="276.4">  optimal performance.</text><text x="1240" y="700" text-anchor="end" font-size="12" fill="#94A3B8" font-family="Microsoft YaHei, SimSun, sans-serif">
    03 / 21
  </text>
</svg>