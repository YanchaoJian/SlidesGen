<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

  
  <rect x="0" y="0" width="1280" height="6" fill="#005587" />

  
  <text x="640" y="45" text-anchor="middle" font-size="32" font-weight="bold" fill="#005587" font-family="Microsoft YaHei, SimSun, sans-serif">
    Computational Complexity: Sequential Model Limits
  </text>

  
  <path fill="#005587" fill-opacity="0.08" d="M46,80 H1234 A6,6 0 0 1 1240,86 V124 A6,6 0 0 1 1234,130 H46 A6,6 0 0 1 40,124 V86 A6,6 0 0 1 46,80 Z" />
  <text x="60" y="110" font-size="15" font-weight="bold" fill="#005587" font-family="Microsoft YaHei, SimSun, sans-serif">
    Self-Attention enables O(1) parallelization, solving the O(n) bottleneck of recurrent models.
  </text>

  
  <path fill="#FFFFFF" stroke="#005587" stroke-width="1" d="M52,150 H608 A12,12 0 0 1 620,162 V568 A12,12 0 0 1 608,580 H52 A12,12 0 0 1 40,568 V162 A12,12 0 0 1 52,150 Z" />
  <path fill="#005587" d="M52,150 H608 A12,12 0 0 1 620,162 V188 A12,12 0 0 1 608,200 H52 A12,12 0 0 1 40,188 V162 A12,12 0 0 1 52,150 Z" />
  <text x="60" y="180" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, SimSun, sans-serif">
    The Sequential Bottleneck
  </text>
  <text fill="#334155" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="221.5">• Recurrent models require O(n) sequential</text><text fill="#334155" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="223">  operations where n is sequence length.</text><text fill="#334155" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="224.5">• This limits training efficiency especially for</text><text fill="#334155" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="226">  long sequences.</text><text fill="#334155" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="227.5">• Maximum path length of O(n) makes learning</text><text fill="#334155" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="229">  long-range dependencies difficult.</text><text fill="#334155" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="230.5">• Convolutional approaches improve parallelization</text><text fill="#334155" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="232">  but path length still grows with distance.</text><text fill="#334155" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="233.5">• Fundamental constraints remain despite</text><text fill="#334155" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="235">  improvements through factorization tricks.</text><text fill="#334155" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="236.5">• Need for an architecture enabling full</text><text fill="#334155" font-size="18" font-family="Microsoft YaHei, SimSun, sans-serif" x="60" y="238">  parallelization while capturing global dependencies.</text><path fill="#FFFFFF" stroke="#005587" stroke-width="1" d="M672,150 H1228 A12,12 0 0 1 1240,162 V568 A12,12 0 0 1 1228,580 H672 A12,12 0 0 1 660,568 V162 A12,12 0 0 1 672,150 Z" />
  <path fill="#005587" d="M672,150 H1228 A12,12 0 0 1 1240,162 V188 A12,12 0 0 1 1228,200 H672 A12,12 0 0 1 660,188 V162 A12,12 0 0 1 672,150 Z" />
  <text x="680" y="180" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, SimSun, sans-serif">
    Table 1: Layer Complexity Comparison
  </text>

  
  <rect x="660" y="210" width="580" height="40" fill="#F1F5F9" />
  <text x="680" y="235" font-size="14" font-weight="bold" fill="#005587" font-family="Microsoft YaHei, SimSun, sans-serif">Layer Type</text>
  <text x="900" y="235" font-size="14" font-weight="bold" fill="#005587" font-family="Microsoft YaHei, SimSun, sans-serif">Complexity</text>
  <text x="1020" y="235" font-size="14" font-weight="bold" fill="#005587" font-family="Microsoft YaHei, SimSun, sans-serif">Sequential Ops</text>
  <text x="1140" y="235" font-size="14" font-weight="bold" fill="#005587" font-family="Microsoft YaHei, SimSun, sans-serif">Max Path Length</text>

  
  
  <rect x="660" y="250" width="580" height="50" fill="#EBF8FF" />
  <text x="680" y="280" font-size="16" font-weight="bold" fill="#005587" font-family="Microsoft YaHei, SimSun, sans-serif">Self-Attention</text>
  <text x="900" y="280" font-size="16" font-weight="bold" fill="#005587" font-family="Microsoft YaHei, SimSun, sans-serif">O(n² · d)</text>
  <text x="1020" y="280" font-size="16" font-weight="bold" fill="#005587" font-family="Microsoft YaHei, SimSun, sans-serif">O(1)</text>
  <text x="1140" y="280" font-size="16" font-weight="bold" fill="#005587" font-family="Microsoft YaHei, SimSun, sans-serif">O(1)</text>

  
  <rect x="660" y="300" width="580" height="50" fill="#FFFFFF" />
  <text x="680" y="330" font-size="16" fill="#334155" font-family="Microsoft YaHei, SimSun, sans-serif">Recurrent</text>
  <text x="900" y="330" font-size="16" fill="#334155" font-family="Microsoft YaHei, SimSun, sans-serif">O(n · d²)</text>
  <text x="1020" y="330" font-size="16" fill="#334155" font-family="Microsoft YaHei, SimSun, sans-serif">O(n)</text>
  <text x="1140" y="330" font-size="16" fill="#334155" font-family="Microsoft YaHei, SimSun, sans-serif">O(n)</text>

  
  <rect x="660" y="350" width="580" height="50" fill="#FFFFFF" />
  <text x="680" y="380" font-size="16" fill="#334155" font-family="Microsoft YaHei, SimSun, sans-serif">Convolutional</text>
  <text x="900" y="380" font-size="16" fill="#334155" font-family="Microsoft YaHei, SimSun, sans-serif">O(k · n · d²)</text>
  <text x="1020" y="380" font-size="16" fill="#334155" font-family="Microsoft YaHei, SimSun, sans-serif">O(1)</text>
  <text x="1140" y="380" font-size="16" fill="#334155" font-family="Microsoft YaHei, SimSun, sans-serif">O(logₖ n)</text>

  
  <rect x="660" y="400" width="580" height="50" fill="#FFFFFF" />
  <text x="680" y="430" font-size="16" fill="#334155" font-family="Microsoft YaHei, SimSun, sans-serif">Self-Attention (restricted)</text>
  <text x="900" y="430" font-size="16" fill="#334155" font-family="Microsoft YaHei, SimSun, sans-serif">O(r · n · d)</text>
  <text x="1020" y="430" font-size="16" fill="#334155" font-family="Microsoft YaHei, SimSun, sans-serif">O(1)</text>
  <text x="1140" y="430" font-size="16" fill="#334155" font-family="Microsoft YaHei, SimSun, sans-serif">O(n/r)</text>

  
  <line x1="40" y1="680" x2="1240" y2="680" stroke="#E2E8F0" stroke-width="1" />

  
  <text x="40" y="700" font-size="10" fill="#94A3B8" font-family="Microsoft YaHei, SimSun, sans-serif">
    Source: Vaswani et al., Attention Is All You Need (2017)
  </text>

  
  <text x="1240" y="700" text-anchor="end" font-size="12" fill="#94A3B8" font-family="Microsoft YaHei, SimSun, sans-serif">
    4 / 21
  </text>
</svg>