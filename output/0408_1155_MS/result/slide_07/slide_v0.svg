<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Book icon -->
    <g id="bookIcon">
      <path d="M25 5 L25 45 L50 35 L75 45 L75 5 L50 15 Z" fill="none" stroke="#0A3D8F" stroke-width="3"/>
      <path d="M25 5 L50 15 L75 5" fill="none" stroke="#0A3D8F" stroke-width="3"/>
      <line x1="50" y1="15" x2="50" y2="35" stroke="#0A3D8F" stroke-width="2"/>
    </g>
    <!-- Institutional logo -->
    <g id="institutionalLogo">
      <circle cx="40" cy="40" r="35" fill="none" stroke="#0A3D8F" stroke-width="3"/>
      <circle cx="40" cy="40" r="28" fill="none" stroke="#0A3D8F" stroke-width="1.5"/>
      <path d="M25 40 L55 40 M40 25 L40 55" stroke="#0A3D8F" stroke-width="2"/>
      <text x="40" y="75" text-anchor="middle" font-size="8" font-weight="bold" fill="#0A3D8F">DUT</text>
    </g>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#F8F9FA"/>
  
  <!-- Top accent bar at y=100 -->
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#0A3D8F" stroke-width="3"/>
  
  <!-- Book icon at title left -->
  <use href="#bookIcon" x="60" y="40" width="50" height="50"/>
  
  <!-- Title -->
  <text x="120" y="70" font-size="44" font-weight="bold" fill="#0A3D8F">Model Details: Positional Encoding &amp; Feed-Forward Network</text>
  
  <!-- Takeaway Box - moved down to avoid overlap with title -->
  <rect x="40" y="85" width="1200" height="45" rx="0" fill="#0A3D8F" fill-opacity="0.08"/>
  <text x="640" y="113" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A3D8F">▸ Sinusoidal encodings provide order; position-wise FFN adds non-linear processing — together they enable sequence modeling without recurrence.</text>
  
  <!-- Card 1: Problem (left) -->
  <!-- White shadow parallelogram -->
  <polygon points="68,155 441,155 441,555 68,555" fill="#FFFFFF" stroke="#0A3D8F" stroke-width="2" transform="skewX(-15)"/>
  <!-- Blue card -->
  <polygon points="60,147 433,147 433,547 60,547" fill="#0A3D8F" stroke="#0A3D8F" stroke-width="2" transform="skewX(-15)"/>
  <!-- Card header -->
  <text x="246" y="192" text-anchor="middle" font-size="32" font-weight="bold" fill="#FFFFFF">Problem</text>
  <!-- Card body - adjusted spacing -->
  <text x="90" y="235" font-size="24" fill="#FFFFFF">Since the model has no recurrence</text>
  <text x="90" y="269" font-size="24" fill="#FFFFFF">or convolution, we must explicitly</text>
  <text x="90" y="303" font-size="24" fill="#FFFFFF">inject information about the order</text>
  <text x="90" y="337" font-size="24" fill="#FFFFFF">of the sequence.</text>
  
  <!-- Card 2: Encoding (center) -->
  <!-- White shadow parallelogram -->
  <polygon points="481,155 854,155 854,555 481,555" fill="#FFFFFF" stroke="#0A3D8F" stroke-width="2" transform="skewX(-15)"/>
  <!-- Blue card -->
  <polygon points="473,147 846,147 846,547 473,547" fill="#0A3D8F" stroke="#0A3D8F" stroke-width="2" transform="skewX(-15)"/>
  <!-- Card header -->
  <text x="659" y="192" text-anchor="middle" font-size="32" font-weight="bold" fill="#FFFFFF">Encoding</text>
  <!-- Card body -->
  <text x="503" y="235" font-size="24" fill="#FFFFFF">We use sinusoidal positional</text>
  <text x="503" y="269" font-size="24" fill="#FFFFFF">encodings added to the input</text>
  <text x="503" y="303" font-size="24" fill="#FFFFFF">embeddings.</text>
  
  <!-- Equation box -->
  <rect x="503" y="325" width="313" height="120" rx="0" fill="#E3F2FD"/>
  <text x="659" y="360" text-anchor="middle" font-size="20" font-weight="bold" fill="#0A3D8F">PE(pos,2i) = sin(pos/10000^(2i/d))</text>
  <text x="659" y="390" text-anchor="middle" font-size="20" font-weight="bold" fill="#0A3D8F">PE(pos,2i+1) = cos(pos/10000^(2i/d))</text>
  <text x="659" y="425" text-anchor="middle" font-size="16" fill="#4A5568">Sine and cosine functions of different frequencies</text>
  
  <!-- Card 3: Benefits & FFN (right) -->
  <!-- White shadow parallelogram -->
  <polygon points="894,155 1267,155 1267,555 894,555" fill="#FFFFFF" stroke="#0A3D8F" stroke-width="2" transform="skewX(-15)"/>
  <!-- Blue card -->
  <polygon points="886,147 1259,147 1259,547 886,547" fill="#0A3D8F" stroke="#0A3D8F" stroke-width="2" transform="skewX(-15)"/>
  <!-- Card header -->
  <text x="1072" y="192" text-anchor="middle" font-size="32" font-weight="bold" fill="#FFFFFF">Benefits &amp; FFN</text>
  <!-- Card body - adjusted spacing -->
  <text x="916" y="235" font-size="24" fill="#FFFFFF">These encodings allow the model</text>
  <text x="916" y="269" font-size="24" fill="#FFFFFF">to easily learn to attend by</text>
  <text x="916" y="303" font-size="24" fill="#FFFFFF">relative positions and generalize</text>
  <text x="916" y="337" font-size="24" fill="#FFFFFF">to longer sequences.</text>
  <text x="916" y="385" font-size="24" fill="#FFFFFF">Each layer also contains a</text>
  <text x="916" y="419" font-size="24" fill="#FFFFFF">Position-wise Feed-Forward</text>
  <text x="916" y="453" font-size="24" fill="#FFFFFF">Network (FFN): a simple two-</text>
  <text x="916" y="487" font-size="24" fill="#FFFFFF">layer MLP with ReLU, applied</text>
  <text x="916" y="521" font-size="24" fill="#FFFFFF">identically to each position.</text>
  
  <!-- Institutional logo at upper right -->
  <use href="#institutionalLogo" x="1140" y="40" width="80" height="80"/>
  
  <!-- Footer: Institutional motto (calligraphic style) -->
  <text x="60" y="660" font-size="16" fill="#1A1A1A" font-family="KaiTi, STKaiti, serif">海纳百川 自强不息</text>
  
  <!-- Footer: Date -->
  <text x="1140" y="660" font-size="16" fill="#718096">2024</text>
  
  <!-- Page number -->
  <text x="1240" y="700" text-anchor="end" font-size="14" fill="#718096">7</text>
</svg>