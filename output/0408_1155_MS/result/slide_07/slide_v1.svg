<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    
    <g id="bookIcon">
      <path d="M25 5 L25 45 L50 35 L75 45 L75 5 L50 15 Z" fill="none" stroke="#0A3D8F" stroke-width="3" />
      <path d="M25 5 L50 15 L75 5" fill="none" stroke="#0A3D8F" stroke-width="3" />
      <line x1="50" y1="15" x2="50" y2="35" stroke="#0A3D8F" stroke-width="2" />
    </g>
    
    <g id="institutionalLogo">
      <circle cx="40" cy="40" r="35" fill="none" stroke="#0A3D8F" stroke-width="3" />
      <circle cx="40" cy="40" r="28" fill="none" stroke="#0A3D8F" stroke-width="1.5" />
      <path d="M25 40 L55 40 M40 25 L40 55" stroke="#0A3D8F" stroke-width="2" />
      <text x="40" y="75" text-anchor="middle" font-size="8" font-weight="bold" fill="#0A3D8F">DUT</text>
    </g>
  </defs>
  
  
  <rect x="0" y="0" width="1280" height="720" fill="#F8F9FA" />
  
  
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#0A3D8F" stroke-width="3" />
  
  
  <use href="#bookIcon" x="60" y="40" width="50" height="50" />
  
  
  <text x="120" y="75" font-size="36" font-weight="bold" fill="#0A3D8F">Model Details: Positional Encoding &amp; Feed-Forward Network</text>
  
  
  <rect x="40" y="130" width="1200" height="45" rx="0" fill="#0A3D8F" fill-opacity="0.08" />
  <text x="640" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A3D8F">▸ Sinusoidal encodings provide order; position-wise FFN adds non-linear processing — together they enable sequence modeling without recurrence.</text>
  
  
  
  <path fill="#FFFFFF" stroke="#0A3D8F" stroke-width="2" d="M76,215 H433 A8,8 0 0 1 441,223 V607 A8,8 0 0 1 433,615 H76 A8,8 0 0 1 68,607 V223 A8,8 0 0 1 76,215 Z" />
  
  <path fill="#0A3D8F" stroke="#0A3D8F" stroke-width="2" d="M68,207 H425 A8,8 0 0 1 433,215 V599 A8,8 0 0 1 425,607 H68 A8,8 0 0 1 60,599 V215 A8,8 0 0 1 68,207 Z" />
  
  <text x="246" y="252" text-anchor="middle" font-size="32" font-weight="bold" fill="#FFFFFF">Problem</text>
  
  <text x="90" y="300" font-size="20" fill="#FFFFFF">Since the model has no recurrence</text>
  <text x="90" y="332" font-size="20" fill="#FFFFFF">or convolution, we must explicitly</text>
  <text x="90" y="364" font-size="20" fill="#FFFFFF">inject information about the order</text>
  <text x="90" y="396" font-size="20" fill="#FFFFFF">of the sequence.</text>
  
  
  
  <path fill="#FFFFFF" stroke="#0A3D8F" stroke-width="2" d="M489,215 H846 A8,8 0 0 1 854,223 V607 A8,8 0 0 1 846,615 H489 A8,8 0 0 1 481,607 V223 A8,8 0 0 1 489,215 Z" />
  
  <path fill="#0A3D8F" stroke="#0A3D8F" stroke-width="2" d="M481,207 H838 A8,8 0 0 1 846,215 V599 A8,8 0 0 1 838,607 H481 A8,8 0 0 1 473,599 V215 A8,8 0 0 1 481,207 Z" />
  
  <text x="659" y="252" text-anchor="middle" font-size="32" font-weight="bold" fill="#FFFFFF">Encoding</text>
  
  <text x="503" y="300" font-size="20" fill="#FFFFFF">We use sinusoidal positional</text>
  <text x="503" y="332" font-size="20" fill="#FFFFFF">encodings added to the input</text>
  <text x="503" y="364" font-size="20" fill="#FFFFFF">embeddings.</text>
  
  
  <rect x="503" y="400" width="313" height="140" rx="0" fill="#E3F2FD" />
  <text x="659" y="435" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A3D8F">PE(pos,2i) = sin(pos/10000^(2i/d))</text>
  <text x="659" y="463" text-anchor="middle" font-size="18" font-weight="bold" fill="#0A3D8F">PE(pos,2i+1) = cos(pos/10000^(2i/d))</text>
  <text x="659" y="495" text-anchor="middle" font-size="14" fill="#4A5568">Sine and cosine functions of different frequencies</text>
  
  
  
  <path fill="#FFFFFF" stroke="#0A3D8F" stroke-width="2" d="M902,215 H1259 A8,8 0 0 1 1267,223 V607 A8,8 0 0 1 1259,615 H902 A8,8 0 0 1 894,607 V223 A8,8 0 0 1 902,215 Z" />
  
  <path fill="#0A3D8F" stroke="#0A3D8F" stroke-width="2" d="M894,207 H1251 A8,8 0 0 1 1259,215 V599 A8,8 0 0 1 1251,607 H894 A8,8 0 0 1 886,599 V215 A8,8 0 0 1 894,207 Z" />
  
  <text x="1072" y="252" text-anchor="middle" font-size="32" font-weight="bold" fill="#FFFFFF">Benefits &amp; FFN</text>
  
  <text x="916" y="295" font-size="20" fill="#FFFFFF">These encodings allow the model</text>
  <text x="916" y="327" font-size="20" fill="#FFFFFF">to easily learn to attend by</text>
  <text x="916" y="359" font-size="20" fill="#FFFFFF">relative positions and generalize</text>
  <text x="916" y="391" font-size="20" fill="#FFFFFF">to longer sequences.</text>
  <text x="916" y="435" font-size="20" fill="#FFFFFF">Each layer also contains a</text>
  <text x="916" y="467" font-size="20" fill="#FFFFFF">Position-wise Feed-Forward</text>
  <text x="916" y="499" font-size="20" fill="#FFFFFF">Network (FFN): a simple two-</text>
  <text x="916" y="531" font-size="20" fill="#FFFFFF">layer MLP with ReLU, applied</text>
  <text x="916" y="563" font-size="20" fill="#FFFFFF">identically to each position.</text>
  
  
  <use href="#institutionalLogo" x="1140" y="40" width="80" height="80" />
  
  
  <text x="60" y="660" font-size="16" fill="#1A1A1A" font-family="KaiTi, STKaiti, serif">海纳百川 自强不息</text>
  
  
  <text x="1140" y="660" font-size="16" fill="#718096">2024</text>
  
  
  <text x="1240" y="700" text-anchor="end" font-size="14" fill="#718096">7</text>
</svg>