<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#F8F9FA"/>

  <!-- Top Divider Line -->
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#0A3D8F" stroke-width="3"/>

  <!-- Book Icon Placeholder -->
  <rect x="60" y="40" width="50" height="50" fill="#0A3D8F"/>

  <!-- Title -->
  <g transform="translate(0, -20)">
    <text x="130" y="95" font-family="Microsoft YaHei" font-size="44" font-weight="bold" fill="#0A3D8F">
      Generalization: Strong Performance on Parsing
    </text>
  </g>

  <!-- Takeaway Box -->
  <rect x="40" y="100" width="1200" height="45" fill="#E3F2FD"/>
  <text x="60" y="125" font-family="Microsoft YaHei" font-size="16" fill="#1A1A1A">
    The Transformer demonstrates strong generalization capabilities in English constituency parsing.
  </text>

  <!-- Parallelogram Card 1 -->
  <g transform="skewX(-15)">
    <rect x="100" y="180" width="320" height="200" fill="#0A3D8F"/>
    <text x="260" y="220" font-family="Microsoft YaHei" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      Task Overview
    </text>
    <text x="130" y="260" font-family="Microsoft YaHei" font-size="22" fill="#FFFFFF">
      • Predict syntactic tree structure
    </text>
    <text x="130" y="300" font-family="Microsoft YaHei" font-size="22" fill="#FFFFFF">
      • Applied to English constituency parsing
    </text>
  </g>

  <!-- Parallelogram Card 2 -->
  <g transform="skewX(-15)">
    <rect x="480" y="180" width="320" height="200" fill="#0A3D8F"/>
    <text x="640" y="220" font-family="Microsoft YaHei" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      Results
    </text>
    <text x="510" y="260" font-family="Microsoft YaHei" font-size="22" fill="#FFFFFF">
      • 91.3 F1 with 40K training sentences
    </text>
    <text x="510" y="300" font-family="Microsoft YaHei" font-size="22" fill="#FFFFFF">
      • Outperforms Berkeley Parser (90.4)
    </text>
    <text x="510" y="340" font-family="Microsoft YaHei" font-size="22" fill="#FFFFFF">
      • Semi-supervised: 92.7 F1
    </text>
  </g>

  <!-- Parallelogram Card 3 -->
  <g transform="skewX(-15)">
    <rect x="860" y="180" width="320" height="200" fill="#0A3D8F"/>
    <text x="1020" y="220" font-family="Microsoft YaHei" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      Conclusion
    </text>
    <text x="890" y="260" font-family="Microsoft YaHei" font-size="22" fill="#FFFFFF">
      • Proves Transformer’s versatility
    </text>
    <text x="890" y="300" font-family="Microsoft YaHei" font-size="22" fill="#FFFFFF">
      • Beyond machine translation tasks
    </text>
  </g>

  <!-- Table Header -->
  <text x="640" y="420" font-family="Microsoft YaHei" font-size="22" font-weight="bold" fill="#1A1A1A" text-anchor="middle">
    Table 4: The Transformer generalizes well to English constituency parsing
  </text>
  <text x="640" y="450" font-family="Microsoft YaHei" font-size="16" fill="#4A5568" text-anchor="middle">
    (Results are on Section 23 of WSJ)
  </text>

  <!-- Table Rows -->
  <g font-family="Microsoft YaHei" font-size="16" fill="#1A1A1A">
    <!-- Header Row -->
    <rect x="200" y="480" width="400" height="30" fill="#E3F2FD"/>
    <rect x="600" y="480" width="200" height="30" fill="#E3F2FD"/>
    <rect x="800" y="480" width="100" height="30" fill="#E3F2FD"/>
    <text x="400" y="500" text-anchor="middle">Parser</text>
    <text x="700" y="500" text-anchor="middle">Training</text>
    <text x="850" y="500" text-anchor="middle">WSJ 23 F1</text>

    <!-- Data Rows -->
    <g>
      <rect x="200" y="510" width="400" height="30" fill="#FFFFFF"/>
      <rect x="600" y="510" width="200" height="30" fill="#FFFFFF"/>
      <rect x="800" y="510" width="100" height="30" fill="#FFFFFF"/>
      <text x="400" y="530" text-anchor="middle">Vinyals &amp; Kaiser el al. (2014) [37]</text>
      <text x="700" y="530" text-anchor="middle">WSJ only, discriminative</text>
      <text x="850" y="530" text-anchor="middle">88.3</text>
    </g>
    <g>
      <rect x="200" y="540" width="400" height="30" fill="#FFFFFF"/>
      <rect x="600" y="540" width="200" height="30" fill="#FFFFFF"/>
      <rect x="800" y="540" width="100" height="30" fill="#FFFFFF"/>
      <text x="400" y="560" text-anchor="middle">Petrov et al. (2006) [29]</text>
      <text x="700" y="560" text-anchor="middle">WSJ only, discriminative</text>
      <text x="850" y="560" text-anchor="middle">90.4</text>
    </g>
    <g>
      <rect x="200" y="570" width="400" height="30" fill="#FFFFFF"/>
      <rect x="600" y="570" width="200" height="30" fill="#FFFFFF"/>
      <rect x="800" y="570" width="100" height="30" fill="#FFFFFF"/>
      <text x="400" y="590" text-anchor="middle">Zhu et al. (2013) [40]</text>
      <text x="700" y="590" text-anchor="middle">WSJ only, discriminative</text>
      <text x="850" y="590" text-anchor="middle">90.4</text>
    </g>
    <g>
      <rect x="200" y="600" width="400" height="30" fill="#FFFFFF"/>
      <rect x="600" y="600" width="200" height="30" fill="#FFFFFF"/>
      <rect x="800" y="600" width="100" height="30" fill="#FFFFFF"/>
      <text x="400" y="620" text-anchor="middle">Dyer et al. (2016) [8]</text>
      <text x="700" y="620" text-anchor="middle">WSJ only, discriminative</text>
      <text x="850" y="620" text-anchor="middle">91.7</text>
    </g>
    <g>
      <rect x="200" y="630" width="400" height="30" fill="#E3F2FD"/>
      <rect x="600" y="630" width="200" height="30" fill="#E3F2FD"/>
      <rect x="800" y="630" width="100" height="30" fill="#E3F2FD"/>
      <text x="400" y="650" text-anchor="middle">Transformer (4 layers)</text>
      <text x="700" y="650" text-anchor="middle">WSJ only, discriminative</text>
      <text x="850" y="650" text-anchor="middle">91.3</text>
    </g>
    <g>
      <rect x="200" y="660" width="400" height="30" fill="#FFFFFF"/>
      <rect x="600" y="660" width="200" height="30" fill="#FFFFFF"/>
      <rect x="800" y="660" width="100" height="30" fill="#FFFFFF"/>
      <text x="400" y="680" text-anchor="middle">Zhu et al. (2013) [40]</text>
      <text x="700" y="680" text-anchor="middle">semi-supervised</text>
      <text x="850" y="680" text-anchor="middle">91.3</text>
    </g>
    <g>
      <rect x="200" y="690" width="400" height="30" fill="#FFFFFF"/>
      <rect x="600" y="690" width="200" height="30" fill="#FFFFFF"/>
      <rect x="800" y="690" width="100" height="30" fill="#FFFFFF"/>
      <text x="400" y="710" text-anchor="middle">Huang &amp; Harper (2009) [14]</text>
      <text x="700" y="710" text-anchor="middle">semi-supervised</text>
      <text x="850" y="710" text-anchor="middle">91.3</text>
    </g>
    <g>
      <rect x="200" y="720" width="400" height="30" fill="#FFFFFF"/>
      <rect x="600" y="720" width="200" height="30" fill="#FFFFFF"/>
      <rect x="800" y="720" width="100" height="30" fill="#FFFFFF"/>
      <text x="400" y="740" text-anchor="middle">McClosky et al. (2006) [26]</text>
      <text x="700" y="740" text-anchor="middle">semi-supervised</text>
      <text x="850" y="740" text-anchor="middle">92.1</text>
    </g>
  </g>

  <!-- Footer -->
  <text x="60" y="700" font-family="Microsoft YaHei" font-size="16" fill="#1A1A1A">
    学术严谨，追求卓越
  </text>
  <text x="1220" y="700" font-family="Microsoft YaHei" font-size="14" fill="#718096" text-anchor="end">
    13 / 16
  </text>
</svg>