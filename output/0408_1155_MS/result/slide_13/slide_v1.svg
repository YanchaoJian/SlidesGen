<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%"> <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="4" dy="4" result="offsetBlur" />
      <feFlood flood-color="#000000" flood-opacity="0.1" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  
  <rect x="0" y="0" width="1280" height="720" fill="#F8F9FA" />
  
  
  <rect x="0" y="100" width="1280" height="3" fill="#0A3D8F" />
  
  
  <g transform="translate(40, 40)">
    <path d="M5 10 L5 40 Q5 45 10 45 L20 45 L25 35 L30 45 L40 45 Q45 45 45 40 L45 10 Q45 5 40 5 L25 5 L20 15 L15 5 L10 5 Q5 5 5 10 Z" fill="none" stroke="#0A3D8F" stroke-width="2.5" />
    <path d="M20 15 L25 5 L30 15" fill="none" stroke="#0A3D8F" stroke-width="2" />
    <line x1="25" y1="15" x2="25" y2="35" stroke="#0A3D8F" stroke-width="2" />
  </g>
  
  
  <text x="100" y="65" font-size="44" font-weight="bold" fill="#0A3D8F" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">Generalization: Strong Performance on Parsing</text>
  
  
  <g transform="translate(1160, 40)">
    <circle cx="40" cy="40" r="35" fill="none" stroke="#0A3D8F" stroke-width="2" />
    <circle cx="40" cy="40" r="28" fill="none" stroke="#0A3D8F" stroke-width="1" />
    <text x="40" y="45" text-anchor="middle" font-size="12" font-weight="bold" fill="#0A3D8F">DUT</text>
  </g>
  
  
  <path fill="#0A3D8F" fill-opacity="0.08" d="M46,80 H1234 A6,6 0 0 1 1240,86 V129 A6,6 0 0 1 1234,135 H46 A6,6 0 0 1 40,129 V86 A6,6 0 0 1 46,80 Z" />
  <text x="640" y="113" text-anchor="middle" font-size="13" font-weight="bold" fill="#0A3D8F">▸ With only WSJ training data, a 4-layer Transformer (91.3 F1) outperforms strong discriminative parsers and remains competitive in semi-supervised settings.</text>
  
  
  <polygon points="48,148 1248,148 1248,388 48,388" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  
  
  <rect x="40" y="140" width="1200" height="240" fill="#0A3D8F" />
  
  
  <text x="640" y="180" text-anchor="middle" font-size="32" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">Experimental Setup</text>
  
  
  <text font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="14" fill="#FFFFFF" x="90" y="220">Task: English constituency parsing (predict syntactic tree structure)</text><text font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="14" fill="#FFFFFF" x="90" y="242">Training: Only 40K WSJ sentences (minimal data)</text><text font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="14" fill="#FFFFFF" x="90" y="264">Model: 4-layer Transformer</text><text font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="14" fill="#FFFFFF" x="90" y="308">Key Finding:</text><text font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="14" fill="#FFFFFF" x="90" y="330">• WSJ-only: 91.3 F1 (outperforms Berkeley Parser 90.4)</text><text font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="14" fill="#FFFFFF" x="90" y="352">• Semi-supervised: 92.7 F1 (competitive with SOTA)</text><text font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif" font-size="14" fill="#FFFFFF" x="90" y="374">This proves the Transformer's versatility beyond machine translation.</text><polygon points="48,388 1248,388 1248,648 48,648" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  
  
  <rect x="40" y="380" width="1200" height="260" fill="#0A3D8F" />
  
  
  <text x="640" y="415" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">Parsing Performance Comparison (WSJ Section 23)</text>
  
  
  <rect x="60" y="435" width="1160" height="30" fill="#1E5AA8" />
  <text x="80" y="455" font-size="13" font-weight="bold" fill="#FFFFFF">Parser</text>
  <text x="680" y="455" font-size="13" font-weight="bold" fill="#FFFFFF">Training</text>
  <text x="1100" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">WSJ 23 F1</text>
  
  
  
  <rect x="60" y="465" width="1160" height="22" fill="#0A3D8F" />
  <text x="80" y="480" font-size="11" fill="#FFFFFF">Vinyals &amp; Kaiser et al. (2014) [37]</text>
  <text x="680" y="480" font-size="11" fill="#FFFFFF">WSJ only, discriminative</text>
  <text x="1100" y="480" text-anchor="middle" font-size="11" fill="#FFFFFF">88.3</text>
  
  
  <rect x="60" y="487" width="1160" height="22" fill="#1E5AA8" fill-opacity="0.3" />
  <text x="80" y="502" font-size="11" fill="#FFFFFF">Petrov et al. (2006) [29]</text>
  <text x="680" y="502" font-size="11" fill="#FFFFFF">WSJ only, discriminative</text>
  <text x="1100" y="502" text-anchor="middle" font-size="11" fill="#FFFFFF">90.4</text>
  
  
  <rect x="60" y="509" width="1160" height="22" fill="#0A3D8F" />
  <text x="80" y="524" font-size="11" fill="#FFFFFF">Zhu et al. (2013) [40]</text>
  <text x="680" y="524" font-size="11" fill="#FFFFFF">WSJ only, discriminative</text>
  <text x="1100" y="524" text-anchor="middle" font-size="11" fill="#FFFFFF">90.4</text>
  
  
  <rect x="60" y="531" width="1160" height="22" fill="#1E5AA8" fill-opacity="0.3" />
  <text x="80" y="546" font-size="11" fill="#FFFFFF">Dyer et al. (2016) [8]</text>
  <text x="680" y="546" font-size="11" fill="#FFFFFF">WSJ only, discriminative</text>
  <text x="1100" y="546" text-anchor="middle" font-size="11" fill="#FFFFFF">91.7</text>
  
  
  <rect x="60" y="553" width="1160" height="22" fill="#0A3D8F" />
  <text x="80" y="568" font-size="11" font-weight="bold" fill="#FFFFFF">Transformer (4 layers)</text>
  <text x="680" y="568" font-size="11" font-weight="bold" fill="#FFFFFF">WSJ only, discriminative</text>
  <rect x="1050" y="553" width="100" height="22" fill="#0A3D8F" />
  <text x="1100" y="568" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFFFFF">91.3</text>
  
  
  <rect x="60" y="575" width="1160" height="22" fill="#1E5AA8" fill-opacity="0.3" />
  <text x="80" y="590" font-size="11" fill="#FFFFFF">Zhu et al. (2013) [40]</text>
  <text x="680" y="590" font-size="11" fill="#FFFFFF">semi-supervised</text>
  <text x="1100" y="590" text-anchor="middle" font-size="11" fill="#FFFFFF">91.3</text>
  
  
  <rect x="60" y="597" width="1160" height="22" fill="#0A3D8F" />
  <text x="80" y="612" font-size="11" fill="#FFFFFF">Huang &amp; Harper (2009) [14]</text>
  <text x="680" y="612" font-size="11" fill="#FFFFFF">semi-supervised</text>
  <text x="1100" y="612" text-anchor="middle" font-size="11" fill="#FFFFFF">91.3</text>
  
  
  <rect x="60" y="619" width="1160" height="22" fill="#1E5AA8" fill-opacity="0.3" />
  <text x="80" y="634" font-size="11" fill="#FFFFFF">McClosky et al. (2006) [26]</text>
  <text x="680" y="634" font-size="11" fill="#FFFFFF">semi-supervised</text>
  <text x="1100" y="634" text-anchor="middle" font-size="11" fill="#FFFFFF">92.1</text>
  
  
  <text x="1180" y="660" text-anchor="end" font-size="9" fill="#FFFFFF" fill-opacity="0.7">Source: Vaswani et al. (2017)</text>
  
  
  <text x="40" y="685" font-size="12" fill="#718096">Source: Vaswani et al. (2017), Table 4</text>
  <text x="1240" y="685" text-anchor="end" font-size="14" fill="#718096">13</text>
  <text x="1100" y="685" font-size="12" fill="#718096">2024</text>
  
  
  <text x="40" y="660" font-size="16" fill="#1A1A1A" font-family="KaiTi, STKaiti, serif">海纳百川</text>
</svg>