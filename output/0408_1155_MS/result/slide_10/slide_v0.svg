  <!-- Title -->
  <text x="100" y="52" font-size="44" font-weight="bold" fill="#0A3D8F" font-family="Microsoft YaHei, PingFang SC, sans-serif">Ablation Study: Validating Design Choices</text>
  
  <!-- Takeaway Box -->
  <rect x="40" y="80" width="1200" height="45" fill="#0A3D8F" fill-opacity="0.08"/>
  <text x="640" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#0A3D8F" font-family="Microsoft YaHei, PingFang SC, sans-serif">▸ 8 attention heads, sufficient dimensionality, and dropout are optimal; larger models perform better as expected.</text>
  
  <!-- Key Findings Card (Parallelogram with white offset) -->
  <!-- White offset layer -->
  <polygon points="68,148 1228,148 1228,288 68,288" fill="#FFFFFF" filter="url(#shadow)"/>
  <!-- Blue parallelogram -->
  <polygon points="60,140 1220,140 1220,280 60,280" fill="#0A3D8F"/>
  <!-- Card header -->
  <text x="640" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">Key Findings</text>
  <!-- Card body - findings -->
  <text x="80" y="215" font-size="18" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">• 8 heads optimal • d_k reduction hurts quality • Larger models perform better</text>
  <text x="80" y="250" font-size="18" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">• Dropout crucial for preventing overfitting • Sinusoidal ≈ learned positional encoding</text>
  
  <!-- Table Card -->
  <rect x="60" y="300" width="1160" height="340" fill="#FFFFFF" stroke="#0A3D8F" stroke-width="2"/>
  <!-- Table header -->
  <rect x="60" y="300" width="1160" height="50" fill="#0A3D8F"/>
