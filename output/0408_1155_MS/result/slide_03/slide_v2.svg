<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="8" dy="8" result="offsetBlur" />
      <feFlood flood-color="#FFFFFF" flood-opacity="1" />
      <feComposite in2="offsetBlur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  
  <rect x="0" y="0" width="1280" height="720" fill="#F8F9FA" />
  
  
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#0A3D8F" stroke-width="3" />
  
  
  <g transform="translate(60, 20)">
    <path d="M5 10 L5 40 L45 40 L45 10 L25 18 Z" fill="none" stroke="#0A3D8F" stroke-width="2.5" />
    <path d="M5 10 L25 18 L45 10" fill="none" stroke="#0A3D8F" stroke-width="2.5" />
    <path d="M25 18 L25 38" fill="none" stroke="#0A3D8F" stroke-width="2" />
    <line x1="10" y1="15" x2="20" y2="15" stroke="#0A3D8F" stroke-width="1.5" />
    <line x1="10" y1="22" x2="18" y2="22" stroke="#0A3D8F" stroke-width="1.5" />
    <line x1="30" y1="15" x2="40" y2="15" stroke="#0A3D8F" stroke-width="1.5" />
    <line x1="30" y1="22" x2="38" y2="22" stroke="#0A3D8F" stroke-width="1.5" />
  </g>
  
  
  <text x="120" y="85" font-size="36" font-weight="bold" fill="#0A3D8F" font-family="Microsoft YaHei, PingFang SC, sans-serif">The Problem: The Sequential Computation Bottleneck</text>
  
  
  <path fill="#E3F2FD" d="M124,100 H1216 A4,4 0 0 1 1220,104 V131 A4,4 0 0 1 1216,135 H124 A4,4 0 0 1 120,131 V104 A4,4 0 0 1 124,100 Z" />
  <text x="140" y="120" font-size="15" fill="#0A3D8F" font-family="Microsoft YaHei, PingFang SC, sans-serif">▸ RNNs cannot be parallelized, creating a fundamental training speed bottleneck.</text>
  
  
  <g transform="translate(60, 150)">
    
    <polygon points="0,8 520,8 480,400 0,400" fill="#FFFFFF" stroke="#0A3D8F" stroke-width="2" />
    
    <polygon points="0,0 520,0 480,392 0,392" fill="#0A3D8F" />
    
    
    <text x="260" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">Key Challenges</text>
    
    
    <text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#FFFFFF" x="30" y="85">1. RNNs are inherently sequential: to process</text><text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#FFFFFF" x="30" y="107">position 'n', you must first process</text><text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#FFFFFF" x="30" y="129">positions 1 through n-1.</text><text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#FFFFFF" x="30" y="165">2. This results in O(n) sequential operations,</text><text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#FFFFFF" x="30" y="187">severely limiting parallelization during training.</text><text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#FFFFFF" x="30" y="220">3. Long training times for long sequences</text><text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#FFFFFF" x="30" y="242">become a major practical constraint.</text><text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#FFFFFF" x="30" y="275">4. Convolutional approaches (ByteNet, ConvS2S)</text><text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#FFFFFF" x="30" y="297">enable parallel computation but introduce</text><text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#FFFFFF" x="30" y="319">another issue...</text><text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#FFFFFF" x="30" y="343">5. The number of operations needed to connect</text><text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#FFFFFF" x="30" y="363">distant positions grows with distance</text><text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#FFFFFF" x="30" y="383">(e.g., O(log_k(n))).</text></g>
  
  
  <g transform="translate(600, 150)">
    
    <polygon points="0,8 600,8 580,430 0,430" fill="#FFFFFF" stroke="#0A3D8F" stroke-width="2" />
    
    <polygon points="0,0 600,0 580,422 0,422" fill="#1E5AA8" />
    
    
    <text x="300" y="30" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">Table 1: Maximum path lengths, per-layer complexity and minimum</text>
    <text x="300" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">number of sequential operations for different layer types.</text>
    
    
    <rect x="20" y="65" width="560" height="35" fill="#0A3D8F" />
    <text x="40" y="87" font-size="13" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">Layer Type</text>
    <text x="210" y="87" font-size="13" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">Complexity per Layer</text>
    <text x="360" y="87" font-size="13" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">Sequential Operations</text>
    <text x="510" y="87" font-size="13" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">Max Path Length</text>
    
    
    <rect x="20" y="100" width="560" height="70" fill="#1E5AA8" />
    <text x="40" y="122" font-size="12" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">Self-Attention</text>
    <text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#FFFFFF" x="210" y="118">O(n² · d)</text><text x="360" y="122" font-size="12" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(1)</text>
    <text x="510" y="122" font-size="12" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(1)</text>
    
    
    <rect x="20" y="170" width="560" height="70" fill="#1E5AA8" />
    <text x="40" y="192" font-size="12" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">Recurrent</text>
    <text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#FFFFFF" x="210" y="188">O(n · d²)</text><text x="360" y="192" font-size="12" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(n)</text>
    <text x="510" y="192" font-size="12" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(n)</text>
    
    
    <rect x="20" y="240" width="560" height="70" fill="#1E5AA8" />
    <text x="40" y="262" font-size="12" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">Convolutional</text>
    <text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#FFFFFF" x="210" y="258">O(k · n · d)</text><text x="360" y="262" font-size="12" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(1)</text>
    <text x="510" y="262" font-size="12" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(log_k(n))</text>
    
    
    <rect x="20" y="310" width="560" height="70" fill="#1E5AA8" />
    <text x="40" y="332" font-size="12" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">Self-Attention (restricted)</text>
    <text font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#FFFFFF" x="210" y="328">O(r · n · d)</text><text x="360" y="332" font-size="12" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(1)</text>
    <text x="510" y="332" font-size="12" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(n/r)</text>
    
    
    <text x="20" y="400" font-size="10" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif" fill-opacity="0.8">Note: n = sequence length, d = representation dimension, k = kernel size, r = neighborhood size</text>
  </g>
  
  
  <line x1="60" y1="620" x2="1220" y2="620" stroke="#0A3D8F" stroke-width="1" />
  
  
  <text x="60" y="640" font-size="10" fill="#718096" font-family="Microsoft YaHei, PingFang SC, sans-serif">Source: Vaswani et al., "Attention Is All You Need" (2017)</text>
  
  
  <text x="60" y="665" font-size="18" fill="#1A1A1A" font-family="KaiTi, STKaiti, serif" font-style="italic">海纳百川 · 自强不息</text>
  
  
  <text x="1220" y="665" text-anchor="end" font-size="14" fill="#718096" font-family="Microsoft YaHei, PingFang SC, sans-serif">2024</text>
  
  
  <text x="1220" y="695" text-anchor="end" font-size="12" fill="#718096" font-family="Arial, sans-serif">03 / 16</text>
</svg>