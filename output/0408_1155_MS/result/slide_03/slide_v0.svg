<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feOffset dx="4" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.1"/>
      <feComposite in2="offsetBlur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#F8F9FA"/>
  
  <!-- Top decorative line -->
  <line x1="60" y1="100" x2="1220" y2="100" stroke="#0A3D8F" stroke-width="3"/>
  
  <!-- Book icon -->
  <g transform="translate(60, 35)">
    <path d="M5 5 L5 40 L45 40 L45 5 L25 12 Z" fill="none" stroke="#0A3D8F" stroke-width="2.5"/>
    <path d="M5 5 L25 12 L45 5" fill="none" stroke="#0A3D8F" stroke-width="2.5"/>
    <line x1="25" y1="12" x2="25" y2="40" stroke="#0A3D8F" stroke-width="2"/>
    <line x1="10" y1="18" x2="20" y2="18" stroke="#0A3D8F" stroke-width="1.5"/>
    <line x1="10" y1="24" x2="20" y2="24" stroke="#0A3D8F" stroke-width="1.5"/>
    <line x1="10" y1="30" x2="18" y2="30" stroke="#0A3D8F" stroke-width="1.5"/>
    <line x1="30" y1="18" x2="40" y2="18" stroke="#0A3D8F" stroke-width="1.5"/>
    <line x1="30" y1="24" x2="40" y2="24" stroke="#0A3D8F" stroke-width="1.5"/>
    <line x1="30" y1="30" x2="38" y2="30" stroke="#0A3D8F" stroke-width="1.5"/>
  </g>
  
  <!-- Title -->
  <text x="125" y="70" font-size="38" font-weight="bold" fill="#0A3D8F" font-family="Microsoft YaHei, PingFang SC, sans-serif">
    The Problem: The Sequential Computation Bottleneck
  </text>
  
  <!-- Left content: Problem description cards -->
  <g transform="translate(60, 130)">
    <!-- Card 1: Sequential nature -->
    <rect x="0" y="0" width="540" height="90" fill="#0A3D8F" filter="url(#cardShadow)"/>
    <text x="270" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">
      1. Sequential Processing Requirement
    </text>
    <text x="30" y="65" font-size="14" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">
      RNNs must process positions 1 through n-1 before position n
    </text>
    
    <!-- Card 2: O(n) operations -->
    <rect x="0" y="105" width="540" height="90" fill="#0A3D8F" filter="url(#cardShadow)"/>
    <text x="270" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">
      2. O(n) Sequential Operations
    </text>
    <text x="30" y="170" font-size="14" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">
      Severely limits parallelization during training
    </text>
    
    <!-- Card 3: Training time issue -->
    <rect x="0" y="210" width="540" height="90" fill="#0A3D8F" filter="url(#cardShadow)"/>
    <text x="270" y="245" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">
      3. Long Training Times
    </text>
    <text x="30" y="275" font-size="14" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">
      Major practical constraint for long sequences
    </text>
    
    <!-- Card 4: Convolutional approaches -->
    <rect x="0" y="315" width="540" height="90" fill="#0A3D8F" filter="url(#cardShadow)"/>
    <text x="270" y="350" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">
      4. Convolutional Approaches (ByteNet, ConvS2S)
    </text>
    <text x="30" y="380" font-size="14" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">
      Enable parallel computation but introduce another issue...
    </text>
    
    <!-- Card 5: Path length issue -->
    <rect x="0" y="420" width="540" height="90" fill="#0A3D8F" filter="url(#cardShadow)"/>
    <text x="270" y="455" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">
      5. Growing Path Length Problem
    </text>
    <text x="30" y="485" font-size="14" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">
      Operations needed: O(log_k(n)), making long-range dependencies harder
    </text>
  </g>
  
  <!-- Right content: Table -->
  <g transform="translate(640, 130)">
    <!-- Table caption -->
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#0A3D8F" font-family="Microsoft YaHei, PingFang SC, sans-serif">
      Table 1: Maximum path lengths, per-layer complexity and minimum number of sequential operations
    </text>
    <text x="0" y="18" font-size="11" fill="#4A5568" font-family="Microsoft YaHei, PingFang SC, sans-serif">
      n = sequence length, d = representation dimension, k = kernel size, r = neighborhood size
    </text>
    
    <!-- Table header row -->
    <rect x="0" y="35" width="580" height="35" fill="#0A3D8F"/>
    <text x="15" y="57" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">Layer Type</text>
    <text x="200" y="57" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">Complexity per Layer</text>
    <text x="360" y="57" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">Sequential Ops</text>
    <text x="480" y="57" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, sans-serif">Max Path Length</text>
    
    <!-- Row 1: Self-Attention -->
    <rect x="0" y="70" width="580" height="50" fill="#FFFFFF" stroke="#0A3D8F" stroke-width="1"/>
    <text x="15" y="95" font-size="12" font-weight="bold" fill="#0A3D8F" font-family="Microsoft YaHei, PingFang SC, sans-serif">Self-Attention</text>
    <text x="200" y="95" font-size="11" fill="#1A1A1A" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(n² · d)</text>
    <text x="360" y="95" font-size="12" font-weight="bold" fill="#2E7D32" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(1)</text>
    <text x="480" y="95" font-size="12" font-weight="bold" fill="#2E7D32" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(1)</text>
    
    <!-- Row 2: Recurrent -->
    <rect x="0" y="120" width="580" height="50" fill="#F8F9FA" stroke="#0A3D8F" stroke-width="1"/>
    <text x="15" y="145" font-size="12" font-weight="bold" fill="#0A3D8F" font-family="Microsoft YaHei, PingFang SC, sans-serif">Recurrent</text>
    <text x="200" y="145" font-size="11" fill="#1A1A1A" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(n · d²)</text>
    <text x="360" y="145" font-size="12" font-weight="bold" fill="#C62828" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(n)</text>
    <text x="480" y="145" font-size="12" font-weight="bold" fill="#C62828" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(n)</text>
    
    <!-- Row 3: Convolutional -->
    <rect x="0" y="170" width="580" height="50" fill="#FFFFFF" stroke="#0A3D8F" stroke-width="1"/>
    <text x="15" y="195" font-size="12" font-weight="bold" fill="#0A3D8F" font-family="Microsoft YaHei, PingFang SC, sans-serif">Convolutional</text>
    <text x="200" y="195" font-size="11" fill="#1A1A1A" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(k · n · d)</text>
    <text x="360" y="195" font-size="12" font-weight="bold" fill="#2E7D32" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(1)</text>
    <text x="480" y="195" font-size="12" font-weight="bold" fill="#C62828" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(log_k(n))</text>
    
    <!-- Row 4: Self-Attention (restricted) -->
    <rect x="0" y="220" width="580" height="50" fill="#F8F9FA" stroke="#0A3D8F" stroke-width="1"/>
    <text x="15" y="245" font-size="12" font-weight="bold" fill="#0A3D8F" font-family="Microsoft YaHei, PingFang SC, sans-serif">Self-Attention (restricted)</text>
    <text x="200" y="245" font-size="11" fill="#1A1A1A" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(r · n · d)</text>
    <text x="360" y="245" font-size="12" font-weight="bold" fill="#2E7D32" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(1)</text>
    <text x="480" y="245" font-size="12" font-weight="bold" fill="#C62828" font-family="Microsoft YaHei, PingFang SC, sans-serif">O(n/r)</text>
  </g>
  
  <!-- Footer -->
  <line x1="60" y1="620" x2="1220" y2="620" stroke="#0A3D8F" stroke-width="2"/>
  
  <!-- Institutional motto (calligraphic style) -->
  <text x="60" y="670" font-size="18" fill="#1A1A1A" font-family="KaiTi, STKaiti, serif" font-style="italic">
    博学笃行 · 求实创新
  </text>
  
  <!-- Date -->
  <text x="1220" y="670" text-anchor="end" font-size="14" fill="#718096" font-family="Microsoft YaHei, PingFang SC, sans-serif">
    2024
  </text>
  
  <!-- Page number -->
  <text x="1220" y="700" text-anchor="end" font-size="12" fill="#718096" font-family="Microsoft YaHei, PingFang SC, sans-serif">
    03 / 16
  </text>
</svg>