<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#F8F9FA"/>
  
  <!-- Definitions for reusable elements -->
  <defs>
    <!-- Book icon -->
    <g id="bookIcon">
      <path d="M10 10 L40 10 L40 45 L10 45 Z" fill="none" stroke="#0A3D8F" stroke-width="3"/>
      <path d="M10 10 L25 15 L25 40 L10 35 Z" fill="#0A3D8F"/>
      <path d="M40 10 L25 15 L25 40 L40 35 Z" fill="#0A3D8F" fill-opacity="0.7"/>
      <line x1="25" y1="15" x2="25" y2="40" stroke="#0A3D8F" stroke-width="2"/>
    </g>
    
    <!-- Institutional logo (circular seal) -->
    <g id="institutionalLogo">
      <circle cx="40" cy="40" r="38" fill="none" stroke="#0A3D8F" stroke-width="3"/>
      <circle cx="40" cy="40" r="30" fill="none" stroke="#0A3D8F" stroke-width="2"/>
      <path d="M25 40 L55 40" stroke="#0A3D8F" stroke-width="2"/>
      <path d="M40 25 L40 55" stroke="#0A3D8F" stroke-width="2"/>
      <text x="40" y="45" text-anchor="middle" font-size="10" font-weight="bold" fill="#0A3D8F">DUT</text>
    </g>
  </defs>
  
  <!-- Top decorative bar -->
  <rect x="0" y="100" width="1280" height="3" fill="#0A3D8F"/>
  
  <!-- Book icon at title left -->
  <use href="#bookIcon" x="60" y="55" width="50" height="50"/>
  
  <!-- Title -->
  <text x="120" y="85" font-size="44" font-weight="bold" fill="#0A3D8F">Questions &amp; Discussion</text>
  
  <!-- Subtitle - moved to y=120 for proper spacing from title (44px title ends at 85, subtitle starts at 100) -->
  <text x="120" y="120" font-size="20" fill="#5A6C7D">Reflecting on findings and future directions</text>
  
  <!-- Institutional logo at upper right -->
  <use href="#institutionalLogo" x="1140" y="40" width="80" height="80"/>
  
  <!-- Small decorative parallelogram - reduced opacity -->
  <polygon points="800,300 1200,300 1200,500 800,500" fill="#0A3D8F" fill-opacity="0.03"/>
  
  <!-- Element 1: Thank You Card -->
  <!-- White parallelogram backing -->
  <polygon points="348,288 948,288 948,408 348,408" fill="#FFFFFF"/>
  <!-- Blue card -->
  <polygon points="340,280 940,280 940,400 340,400" fill="#0A3D8F"/>
  <!-- Card header -->
  <text x="640" y="325" text-anchor="middle" font-size="32" font-weight="bold" fill="#FFFFFF">Thank You</text>
  <!-- Card body -->
  <text x="640" y="370" text-anchor="middle" font-size="24" fill="#FFFFFF">Thank you for your attention!</text>
  
  <!-- Element 2: Invitation Card -->
  <!-- White parallelogram backing -->
  <polygon points="348,448 948,448 948,548 348,548" fill="#FFFFFF"/>
  <!-- Blue card -->
  <polygon points="340,440 940,440 940,540 340,540" fill="#0A3D8F"/>
  <!-- Card header - adjusted y for proper spacing -->
  <text x="640" y="475" text-anchor="middle" font-size="28" font-weight="bold" fill="#FFFFFF">Open Discussion</text>
  <!-- Card body - moved to y=530 to ensure ≥20px gap from header (header ends at ~490, body starts at 506) -->
  <text x="640" y="530" text-anchor="middle" font-size="24" fill="#FFFFFF">Questions and feedback are welcome.</text>
  
  <!-- Footer: Institutional motto -->
  <text x="60" y="660" font-size="16" fill="#1A1A1A" font-family="Microsoft YaHei, PingFang SC, Hiragino Sans GB, sans-serif">海纳百川 自强不息 厚德笃学 知行合一</text>
  
  <!-- Footer: Date -->
  <text x="1140" y="660" font-size="16" fill="#718096" text-anchor="end">April 2024</text>
  
  <!-- Page number -->
  <text x="1240" y="700" font-size="14" fill="#718096" text-anchor="end">16</text>
</svg>