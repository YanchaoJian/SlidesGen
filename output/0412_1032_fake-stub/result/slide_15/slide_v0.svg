<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="6" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  
  
  <!-- Top Accent Bar -->
  <rect x="0" y="100" width="1280" height="3" fill="#0A3D8F"/>
  
  <!-- Book Icon -->
  <g transform="translate(60, 40)">
    <path d="M 0 0 L 50 0 L 50 40 L 0 40 Z" fill="#0A3D8F"/>
    <path d="M 5 5 L 45 5 L 45 35 L 5 35 Z" fill="#FFFFFF"/>
    <path d="M 10 10 L 40 10 L 40 15 L 10 15 Z" fill="#0A3D8F"/>
    <path d="M 10 20 L 40 20 L 40 25 L 10 25 Z" fill="#0A3D8F"/>
    <path d="M 10 30 L 40 30 L 40 35 L 10 35 Z" fill="#0A3D8F"/>
  </g>
  
  <!-- Page Title -->
  <text x="120" y="65" font-size="44" font-weight="bold" fill="#0A3D8F" font-family="'Microsoft YaHei', sans-serif">Impact &amp; Future Directions</text>
  
  <!-- Takeaway Box -->
  <rect x="40" y="80" width="1200" height="45" fill="#E2E8F0"/>
  <text x="60" y="105" font-size="18" fill="#1A1A1A" font-family="'Microsoft YaHei', sans-serif">This work defined a new paradigm in NLP, powering the LLM revolution.</text>
  
  <!-- Card 1: Impact -->
  <g transform="translate(60, 160)">
    <!-- Shadow -->
    <polygon points="0,0 260,0 260,280 0,280" fill="#FFFFFF" transform="translate(8,8)"/>
    <!-- Card -->
    <polygon points="0,0 260,0 260,280 0,280" fill="#0A3D8F"/>
    <!-- Header -->
    <rect x="0" y="0" width="260" height="80" fill="#0A3D8F"/>
    <text x="130" y="50" text-anchor="middle" font-size="32" font-weight="bold" fill="#FFFFFF" font-family="'Microsoft YaHei', sans-serif">Impact</text>
    <!-- Body -->
    <text x="30" y="120" font-size="22" fill="#FFFFFF" font-family="'Microsoft YaHei', sans-serif">• The Transformer has become the foundational architecture for nearly all modern NLP (BERT, GPT, T5, etc.).</text>
  </g>
  
  <!-- Card 2: Future Directions -->
  <g transform="translate(460, 160)">
    <!-- Shadow -->
    <polygon points="0,0 260,0 260,280 0,280" fill="#FFFFFF" transform="translate(8,8)"/>
    <!-- Card -->
    <polygon points="0,0 260,0 260,280 0,280" fill="#0A3D8F"/>
    <!-- Header -->
    <rect x="0" y="0" width="260" height="80" fill="#0A3D8F"/>
    <text x="130" y="50" text-anchor="middle" font-size="32" font-weight="bold" fill="#FFFFFF" font-family="'Microsoft YaHei', sans-serif">Future Directions</text>
    <!-- Body -->
    <text x="30" y="120" font-size="22" fill="#FFFFFF" font-family="'Microsoft YaHei', sans-serif">• Extending attention to other modalities (images, audio, video).</text>
    <text x="30" y="150" font-size="22" fill="#FFFFFF" font-family="'Microsoft YaHei', sans-serif">• Investigating efficient (local/restricted) attention for very long sequences.</text>
    <text x="30" y="180" font-size="22" fill="#FFFFFF" font-family="'Microsoft YaHei', sans-serif">• Exploring non-autoregressive or less sequential generation methods.</text>
    <text x="30" y="210" font-size="22" fill="#FFFFFF" font-family="'Microsoft YaHei', sans-serif">• The paper's final sentence: 'We leave this for future work.'</text>
  </g>
  
  <!-- Card 3: Presenter Notes -->
  <g transform="translate(860, 160)">
    <!-- Shadow -->
    <polygon points="0,0 260,0 260,280 0,280" fill="#FFFFFF" transform="translate(8,8)"/>
    <!-- Card -->
    <polygon points="0,0 260,0 260,280 0,280" fill="#0A3D8F"/>
    <!-- Header -->
    <rect x="0" y="0" width="260" height="80" fill="#0A3D8F"/>
    <text x="130" y="50" text-anchor="middle" font-size="32" font-weight="bold" fill="#FFFFFF" font-family="'Microsoft YaHei', sans-serif">Notes</text>
    <!-- Body -->
    <text x="30" y="120" font-size="22" fill="#FFFFFF" font-family="'Microsoft YaHei', sans-serif">This work didn't just propose a model;</text>
    <text x="30" y="150" font-size="22" fill="#FFFFFF" font-family="'Microsoft YaHei', sans-serif">it defined a new paradigm.</text>
    <text x="30" y="180" font-size="22" fill="#FFFFFF" font-family="'Microsoft YaHei', sans-serif">Its impact is immense, powering the LLM</text>
    <text x="30" y="210" font-size="22" fill="#FFFFFF" font-family="'Microsoft YaHei', sans-serif">revolution. The future directions it</text>
    <text x="30" y="240" font-size="22" fill="#FFFFFF" font-family="'Microsoft YaHei', sans-serif">outlined are still active areas of</text>
    <text x="30" y="270" font-size="22" fill="#FFFFFF" font-family="'Microsoft YaHei', sans-serif">research today.</text>
  </g>
  
  <!-- Footer -->
  <text x="60" y="700" font-size="16" fill="#1A1A1A" font-family="'Microsoft YaHei', sans-serif">Dalian University of Technology</text>
  <text x="1220" y="700" text-anchor="end" font-size="14" fill="#718096" font-family="Arial">15 / 16</text>
</svg>