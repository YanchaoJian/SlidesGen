<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  
  <rect x="0" y="0" width="1280" height="720" fill="#F8F9FA" />
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E9ECEF" stroke-width="1" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="url(#grid)" />

  
  <g transform="translate(60, 35)">
    
    <polygon points="0,0 40,0 30,35 -10,35" fill="#003D7C" />
    <line x1="5" y1="10" x2="25" y2="10" stroke="#FFFFFF" stroke-width="2" />
    <line x1="3" y1="18" x2="23" y2="18" stroke="#FFFFFF" stroke-width="2" />
    <line x1="1" y1="26" x2="21" y2="26" stroke="#FFFFFF" stroke-width="2" />
    
    
    <text x="60" y="28" font-family="&quot;Microsoft YaHei&quot;, &quot;SimHei&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A1A1A">Technical Detail: Injecting Order via Positional Encodings</text>
    
    
    <text x="1160" y="25" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#003D7C">DUT RESEARCH</text>
  </g>

  
  <path fill="#E6EEF7" d="M64,100 H1216 A4,4 0 0 1 1220,104 V146 A4,4 0 0 1 1216,150 H64 A4,4 0 0 1 60,146 V104 A4,4 0 0 1 64,100 Z" />
  <text x="85" y="132" font-family="&quot;Microsoft YaHei&quot;, &quot;SimHei&quot;, Arial, sans-serif" font-size="20" font-weight="600" fill="#003D7C">
    ▸ Positional encodings inject sequence order into Transformers via sine/cosine functions, enabling relative position learning.
  </text>

  
  <path fill="#003D7C" d="M68,175 H1212 A8,8 0 0 1 1220,183 V447 A8,8 0 0 1 1212,455 H68 A8,8 0 0 1 60,447 V183 A8,8 0 0 1 68,175 Z" />
  
  <path fill="#0056A6" d="M64,175 H66 A4,4 0 0 1 70,179 V451 A4,4 0 0 1 66,455 H64 A4,4 0 0 1 60,451 V179 A4,4 0 0 1 64,175 Z" />
  
  <text font-size="20" fill="#FFFFFF" font-family="&quot;Microsoft YaHei&quot;, &quot;SimHei&quot;, Arial, sans-serif" x="110" y="230">Since the model contains no recurrence or convolution, it has no inherent sense of sequence order.</text><text font-size="20" fill="#FFFFFF" font-family="&quot;Microsoft YaHei&quot;, &quot;SimHei&quot;, Arial, sans-serif" x="110" y="275">We inject 'positional encodings' into the input embeddings at the bottoms of the encoder and decoder stacks.</text><text font-size="20" fill="#FFFFFF" font-family="&quot;Microsoft YaHei&quot;, &quot;SimHei&quot;, Arial, sans-serif" x="110" y="320">We use sine and cosine functions of different frequencies to represent absolute positions.</text><text font-size="20" fill="#FFFFFF" font-family="&quot;Microsoft YaHei&quot;, &quot;SimHei&quot;, Arial, sans-serif" x="110" y="365">This allows the model to learn to attend by relative positions, as for any fixed offset k,</text><text font-size="20" fill="#FFD700" font-family="&quot;Microsoft YaHei&quot;, &quot;SimHei&quot;, Arial, sans-serif" x="110" y="410" font-weight="bold">PE(pos+k) can be represented as a linear function of PE(pos).</text><path fill="#FFFFFF" stroke="#003D7C" stroke-width="1.5" d="M68,485 H1212 A8,8 0 0 1 1220,493 V637 A8,8 0 0 1 1212,645 H68 A8,8 0 0 1 60,637 V493 A8,8 0 0 1 68,485 Z" />
  <path fill="#F4F7FA" d="M68,485 H1212 A8,8 0 0 1 1220,493 V517 A8,8 0 0 1 1212,525 H68 A8,8 0 0 1 60,517 V493 A8,8 0 0 1 68,485 Z" />
  <text x="85" y="512" font-family="&quot;Microsoft YaHei&quot;, &quot;SimHei&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#003D7C">Mathematical Formulation</text>
  
  <text font-size="24" fill="#1A1A1A" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" x="640" y="570">PE(pos, 2i) = sin(pos / 10000^(2i / d_model))</text><text font-size="24" fill="#1A1A1A" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" x="640" y="615">PE(pos, 2i+1) = cos(pos / 10000^(2i / d_model))</text><line x1="60" y1="680" x2="1220" y2="680" stroke="#DEE2E6" stroke-width="1" />
  <text x="60" y="705" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#808080">Dalian University of Technology · Attention Is All You Need</text>
  <text x="640" y="705" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#808080">May 2024</text>
  <text x="1220" y="705" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" font-size="14" fill="#808080">08 / 17</text>
</svg>