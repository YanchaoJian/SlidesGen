<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E9ECEF" />
    </pattern>
  </defs>

  
  <rect width="1280" height="720" fill="#F8F9FA" />
  <rect width="1280" height="720" fill="url(#gridPattern)" />

  
  <g id="header">
    <rect x="60" y="40" width="40" height="40" fill="#003D7C" />
    <text x="120" y="75" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#003D7C">FFN: Position-Wise Transformations</text>
    <rect x="60" y="95" width="1160" height="2" fill="#003D7C" />
  </g>

  
  <g id="takeaway">
    <rect x="60" y="115" width="1160" height="45" fill="#003D7C" fill-opacity="0.08" />
    <text x="80" y="145" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#003D7C">
      ▸ FFNs apply identical transformations to each position independently, introducing non-linearity via ReLU.
    </text>
  </g>

  
  <g id="cards">
    
    <path fill="#003D7C" d="M88,200 H432 A8,8 0 0 1 440,208 V412 A8,8 0 0 1 432,420 H88 A8,8 0 0 1 80,412 V208 A8,8 0 0 1 88,200 Z" />
    <text x="260" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">APPLICATION</text>
    <text font-size="18" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif" x="260" y="290">Applied to each position</text><text font-size="18" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif" x="260" y="315">separately and identically</text><text font-size="18" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif" x="260" y="340">across all layers.</text><path fill="#003D7C" d="M468,200 H812 A8,8 0 0 1 820,208 V412 A8,8 0 0 1 812,420 H468 A8,8 0 0 1 460,412 V208 A8,8 0 0 1 468,200 Z" />
    <text x="640" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">STRUCTURE</text>
    <text font-size="18" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif" x="640" y="290">Two linear transformations</text><text font-size="18" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif" x="640" y="315">with a ReLU activation</text><text font-size="18" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif" x="640" y="340">function in between.</text><path fill="#003D7C" d="M848,200 H1192 A8,8 0 0 1 1200,208 V412 A8,8 0 0 1 1192,420 H848 A8,8 0 0 1 840,412 V208 A8,8 0 0 1 848,200 Z" />
    <text x="1020" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">PARAMETERS</text>
    <text font-size="18" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif" x="1020" y="290">Shared across positions,</text><text font-size="18" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif" x="1020" y="315">but unique parameters</text><text font-size="18" fill="#FFFFFF" text-anchor="middle" font-family="Arial, sans-serif" x="1020" y="340">for every layer.</text></g>

  
  <g id="equation">
    <path fill="#FFFFFF" stroke="#003D7C" stroke-width="2" d="M68,480 H1212 A8,8 0 0 1 1220,488 V612 A8,8 0 0 1 1212,620 H68 A8,8 0 0 1 60,612 V488 A8,8 0 0 1 68,480 Z" />
    <text x="640" y="540" text-anchor="middle" font-family="Courier New, monospace" font-size="36" font-weight="bold" fill="#003D7C">
      FFN(x) = max(0, xW₁ + b₁)W₂ + b₂
    </text>
    <text x="640" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#555555">
      Linear transformations are applied identically to every position in the sequence.
    </text>
  </g>

  
  <g id="footer">
    <line x1="60" y1="680" x2="1220" y2="680" stroke="#003D7C" stroke-width="1" />
    <text x="60" y="705" font-family="Arial, sans-serif" font-size="14" fill="#808080">Dalian University of Technology</text>
    <text x="1220" y="705" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#808080">07 / 17</text>
  </g>
</svg>