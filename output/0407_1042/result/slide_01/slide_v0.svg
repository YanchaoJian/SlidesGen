<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E9ECEF" />
    </pattern>
    <filter id="hardShadow" x="-20%" y="-20%" width="200%" height="200%">
      <feOffset dx="6" dy="6" result="offset" />
      <feFlood flood-color="#003D7C" flood-opacity="0.1" />
      <feComposite in2="offset" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect width="1280" height="720" fill="#F8F9FA" />
  <rect width="1280" height="720" fill="url(#grid)" />

  
  <polygon points="1040,0 1280,0 1280,720 1058,720" fill="#003D7C" />
  <polygon points="1020,20 1260,20 1260,700 1038,700" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2" />

  
  <text x="80" y="80" font-family="Microsoft YaHei, Arial" font-size="54" font-weight="bold" fill="#003D7C">Attention Is All You Need</text>

  
  <rect x="80" y="110" width="920" height="45" fill="#003D7C" fill-opacity="0.08" />
  <text x="100" y="138" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="bold" fill="#003D7C">KEY TAKEAWAY: The Transformer architecture replaces recurrence with attention for superior parallelization.</text>

  
  <text font-size="24" fill="#333333" font-weight="bold" font-family="Microsoft YaHei, Arial" x="80" y="240">Ashish Vaswani, Noam Shazeer, Niki Parmar, Jakob Uszkoreit,</text><text font-size="24" fill="#333333" font-weight="bold" font-family="Microsoft YaHei, Arial" x="80" y="274">Llion Jones, Aidan N. Gomez, Łukasz Kaiser, Illia Polosukhin</text><text font-size="18" fill="#666666" font-family="Microsoft YaHei, Arial" x="80" y="340">Google Brain · Google Research · University of Toronto</text><text font-size="18" fill="#003D7C" font-family="Microsoft YaHei, Arial" x="80" y="372" font-weight="bold">31st Conference on Neural Information Processing Systems (NeurIPS 2017)</text><g filter="url(#hardShadow)">
    <path fill="#FFFFFF" d="M84,440 H996 A4,4 0 0 1 1000,444 V556 A4,4 0 0 1 996,560 H84 A4,4 0 0 1 80,556 V444 A4,4 0 0 1 84,440 Z" />
    <path fill="#003D7C" d="M82,440 H86 A2,2 0 0 1 88,442 V558 A2,2 0 0 1 86,560 H82 A2,2 0 0 1 80,558 V442 A2,2 0 0 1 82,440 Z" />
    <text font-size="22" fill="#1A1A1A" font-family="Microsoft YaHei, Arial" x="115" y="490">A new simple network architecture, the Transformer, based solely on</text><text font-size="22" fill="#1A1A1A" font-family="Microsoft YaHei, Arial" x="115" y="528">attention mechanisms, dispensing with recurrence and convolutions entirely.</text></g>

  
  <line x1="80" y1="650" x2="1000" y2="650" stroke="#003D7C" stroke-width="1" stroke-opacity="0.2" />
  
  <text x="80" y="685" font-family="Microsoft YaHei, Arial" font-size="14" fill="#808080" letter-spacing="1">
    SELF-RELIANCE AND RIGOROUS SCHOLARSHIP · SEEKING TRUTH AND PROMOTING INNOVATION
  </text>
  
  <text x="1240" y="685" text-anchor="end" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">
    DECEMBER 2017 | 01 / 17
  </text>

  
  <g transform="translate(1110, 40)">
    <rect x="0" y="0" width="120" height="50" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="1" />
    <text x="60" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF" letter-spacing="2">DUT LOGO</text>
  </g>
</svg>