<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  
  <rect x="0" y="0" width="1280" height="720" fill="#F8F9FA" />
  
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E9ECEF" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="url(#grid)" />

  
  <rect x="40" y="30" width="8" height="45" fill="#003D7C" />
  <text x="65" y="65" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#1A1A1A">Experimental Setup: Machine Translation</text>

  
  <rect x="40" y="90" width="1200" height="45" fill="#003D7C" fill-opacity="0.08" />
  <text x="60" y="118" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#003D7C">
    ▸ Our experimental setup leverages large datasets and powerful hardware for efficient, scalable machine translation training.
  </text>

  
  <rect x="40" y="165" width="580" height="485" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="1" />
  <rect x="40" y="165" width="580" height="50" fill="#003D7C" />
  <text x="65" y="198" font-family="Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold">Experimental Details</text>
  
  <g font-family="Arial, sans-serif" font-size="18" fill="#1A1A1A">
    
    <text x="65" y="250" font-weight="bold" fill="#003D7C">Datasets:</text>
    <text x="65" y="275">WMT 2014 English-to-German (4.5M pairs)</text>
    <text x="65" y="300">and English-to-French (36M pairs).</text>
    
    
    <text x="65" y="350" font-weight="bold" fill="#003D7C">Hardware:</text>
    <text x="65" y="375">8 NVIDIA P100 GPUs.</text>
    
    
    <text x="65" y="425" font-weight="bold" fill="#003D7C">Training:</text>
    <text x="65" y="450">Base: 100,000 steps (12 hours)</text>
    <text x="65" y="475">Big: 300,000 steps (3.5 days)</text>
    
    
    <text x="65" y="525" font-weight="bold" fill="#003D7C">Optimizer:</text>
    <text x="65" y="550">Adam with custom learning rate</text>
    <text x="65" y="575">scheduler featuring a warmup phase.</text>
  </g>

  
  <rect x="660" y="165" width="580" height="485" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="1" />
  <rect x="660" y="165" width="580" height="50" fill="#003D7C" fill-opacity="0.9" />
  <text x="685" y="198" font-family="Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="bold">Learning Rate Schedule</text>
  
  <text font-size="18" fill="#1A1A1A" font-family="Arial, sans-serif" x="685" y="250">We varied the learning rate over the course</text><text font-size="18" fill="#1A1A1A" font-family="Arial, sans-serif" x="685" y="278">of training, according to the formula:</text><path fill="#F4F7FA" d="M689,320 H1211 A4,4 0 0 1 1215,324 V436 A4,4 0 0 1 1211,440 H689 A4,4 0 0 1 685,436 V324 A4,4 0 0 1 689,320 Z" />
  <text font-size="22" fill="#003D7C" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" x="950" y="375">lrate = d_model^-0.5 · min(step_num^-0.5,</text><text font-size="22" fill="#003D7C" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif" x="950" y="415">step_num · warmup_steps^-1.5) (3)</text><line x1="40" y1="680" x2="1240" y2="680" stroke="#003D7C" stroke-width="1" stroke-opacity="0.3" />
  <text x="40" y="705" font-family="Arial, sans-serif" font-size="14" fill="#808080">Dalian University of Technology · Research Methodology</text>
  <text x="1240" y="705" font-family="Arial, sans-serif" font-size="14" fill="#808080" text-anchor="end">09 / 17</text>
</svg>