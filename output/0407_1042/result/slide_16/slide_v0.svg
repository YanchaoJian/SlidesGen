<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Page Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#F8F9FA"/>

  <!-- Background Grid Pattern -->
  <g stroke="#E9ECEF" stroke-width="1">
    <!-- Horizontal lines -->
    <line x1="0" y1="0" x2="1280" y2="0"/>
    <line x1="0" y1="40" x2="1280" y2="40"/>
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="200" x2="1280" y2="200"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="280" x2="1280" y2="280"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="440" x2="1280" y2="440"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="520" x2="1280" y2="520"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="0" y1="680" x2="1280" y2="680"/>
    <line x1="0" y1="720" x2="1280" y2="720"/>
    <!-- Vertical lines -->
    <line x1="0" y1="0" x2="0" y2="720"/>
    <line x1="40" y1="0" x2="40" y2="720"/>
    <line x1="80" y1="0" x2="80" y2="720"/>
    <line x1="120" y1="0" x2="120" y2="720"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="200" y1="0" x2="200" y2="720"/>
    <line x1="240" y1="0" x2="240" y2="720"/>
    <line x1="280" y1="0" x2="280" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="360" y1="0" x2="360" y2="720"/>
    <line x1="400" y1="0" x2="400" y2="720"/>
    <line x1="440" y1="0" x2="440" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="520" y1="0" x2="520" y2="720"/>
    <line x1="560" y1="0" x2="560" y2="720"/>
    <line x1="600" y1="0" x2="600" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="680" y1="0" x2="680" y2="720"/>
    <line x1="720" y1="0" x2="720" y2="720"/>
    <line x1="760" y1="0" x2="760" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="840" y1="0" x2="840" y2="720"/>
    <line x1="880" y1="0" x2="880" y2="720"/>
    <line x1="920" y1="0" x2="920" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1000" y1="0" x2="1000" y2="720"/>
    <line x1="1040" y1="0" x2="1040" y2="720"/>
    <line x1="1080" y1="0" x2="1080" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
    <line x1="1160" y1="0" x2="1160" y2="720"/>
    <line x1="1200" y1="0" x2="1200" y2="720"/>
    <line x1="1240" y1="0" x2="1240" y2="720"/>
    <line x1="1280" y1="0" x2="1280" y2="720"/>
  </g>

  <!-- Decorative Carryover (Bottom Right) - Fixed Geometry to prevent overflow -->
  <!-- Ghost Outline -->
  <rect x="1050" y="450" width="230" height="270" fill="none" stroke="#003D7C" stroke-width="1" transform="skewX(-20)"/>
  <!-- Primary Shape -->
  <rect x="1040" y="440" width="230" height="270" fill="#003D7C" transform="skewX(-20)"/>

  <!-- Institutional Logo Placeholder -->
  <text x="1220" y="60" text-anchor="end" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#003D7C" letter-spacing="1">DUT Logo</text>

  <!-- Central Content Group -->
  <g>
    <!-- Central Decorative Icon (Skewed Document Motif) - Adjusted X to visually center considering skew -->
    <g transform="translate(625, 160) skewX(-20)">
      <rect x="0" y="0" width="60" height="80" fill="#E6EEF7"/>
      <rect x="15" y="24" width="30" height="4" fill="#FFFFFF"/>
      <rect x="15" y="38" width="30" height="4" fill="#FFFFFF"/>
      <rect x="15" y="52" width="30" height="4" fill="#FFFFFF"/>
    </g>

    <!-- Title -->
    <text x="640" y="310" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="64" font-weight="bold" fill="#003D7C" letter-spacing="2">Questions &amp; Discussion</text>

    <!-- Separator line -->
    <line x1="560" y1="350" x2="720" y2="350" stroke="#0056A6" stroke-width="3"/>

    <!-- Closing Message Line 1 -->
    <text x="640" y="420" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#1A1A1A">Thank you for your attention!</text>

    <!-- Closing Message Line 2 -->
    <text x="640" y="470" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="24" font-weight="normal" fill="#666666">Questions and feedback are welcome.</text>
  </g>

  <!-- Footer Divider Line -->
  <line x1="60" y1="660" x2="1220" y2="660" stroke="#003D7C" stroke-width="1"/>

  <!-- Footer Motto -->
  <text x="60" y="690" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="14" fill="#808080" font-weight="bold">Dalian University Academic Presentation</text>

  <!-- Page Number -->
  <text x="1220" y="690" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#808080" font-weight="bold">16</text>
</svg>