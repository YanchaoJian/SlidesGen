<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="10" result="offsetBlur"/>
      <feFlood flood-color="#003D7C" flood-opacity="0.15" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#003D7C"/>
  
  <!-- Decorative DUT logo placeholder (large, low opacity) -->
  <circle cx="640" cy="360" r="200" fill="#FFFFFF" fill-opacity="0.05"/>
  <circle cx="640" cy="360" r="160" fill="#FFFFFF" fill-opacity="0.03"/>
  
  <!-- Main title (centered, cover page treatment) - increased size and spacing -->
  <text x="640" y="260" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="68" font-weight="bold" fill="#FFFFFF">
    Background: Sequence Transduction Models
  </text>
  <text x="640" y="350" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="68" font-weight="bold" fill="#FFFFFF">
    and Their Importance
  </text>
  
  <!-- Subtitle - increased spacing from title -->
  <text x="640" y="460" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="26" fill="#FFFFFF" fill-opacity="0.85">
    Critical for language modeling, translation, and speech recognition
  </text>
  
  <!-- Decorative line - aligned with subtitle spacing -->
  <line x1="440" y1="510" x2="840" y2="510" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5"/>
  
  <!-- Page number - consistent positioning -->
  <text x="1240" y="700" text-anchor="end" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.6">
    1 / 10
  </text>
</svg>