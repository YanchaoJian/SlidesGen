<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="10" result="offsetBlur" />
      <feFlood flood-color="#003D7C" flood-opacity="0.15" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  
  <rect x="0" y="0" width="1280" height="4" fill="#003D7C" />
  
  <polygon points="40,30 70,30 80,70 50,70" fill="#003D7C" />
  
  <text x="100" y="60" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="38" font-weight="bold" fill="#003D7C">Transformer模型在翻译质量和效率上超越先前最优模型</text>
  
  <path fill="#003D7C" fill-opacity="0.08" d="M46,80 H1234 A6,6 0 0 1 1240,86 V119 A6,6 0 0 1 1234,125 H46 A6,6 0 0 1 40,119 V86 A6,6 0 0 1 46,80 Z" />
  <text x="60" y="108" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#003D7C">▸ Transformer在更低训练成本下实现更高BLEU分数</text>
  
  <rect x="40" y="145" width="1200" height="510" fill="#0056A4" filter="url(#shadow)" />
  
  <rect x="40" y="145" width="1200" height="55" fill="#003D7C" />
  <text x="640" y="180" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">翻译质量与效率对比</text>
  
  <rect x="60" y="220" width="1160" height="45" fill="#003D7C" />
  <text x="340" y="248" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">模型</text>
  <text x="680" y="248" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">EN-DE</text>
  <text x="860" y="248" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">EN-FR</text>
  <text x="1060" y="248" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">训练成本 (FLOPs)</text>
  
  <line x1="60" y1="265" x2="1220" y2="265" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" />
  
  <text x="80" y="298" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">GNMT + RL Ensemble [38]</text>
  <text x="680" y="298" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">26.30</text>
  <text x="860" y="298" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">41.16</text>
  <text x="1060" y="298" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">1.8 · 10²⁰</text>
  
  <line x1="60" y1="315" x2="1220" y2="315" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2" />
  
  <text x="80" y="348" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">ConvS2S Ensemble [9]</text>
  <text x="680" y="348" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">26.36</text>
  <text x="860" y="348" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">41.29</text>
  <text x="1060" y="348" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">7.7 · 10¹⁹</text>
  
  <line x1="60" y1="365" x2="1220" y2="365" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.2" />
  
  <rect x="60" y="375" width="1160" height="50" fill="#0072CE" fill-opacity="0.35" />
  <text x="80" y="407" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Transformer (big)</text>
  <text x="680" y="407" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">28.4</text>
  <text x="860" y="407" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">41.8</text>
  <text x="1060" y="407" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">2.3 · 10¹⁹</text>
  
  <line x1="60" y1="425" x2="1220" y2="425" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" />
  
  <text x="80" y="465" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">关键发现：</text>
  <text x="80" y="500" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">• EN-DE任务BLEU分数28.4，超越先前最优模型2.04分</text>
  <text x="80" y="530" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">• EN-FR任务BLEU分数41.8，创单模型新纪录</text>
  <text x="80" y="560" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">• 训练成本降低70%（相比ConvS2S）</text>
  <text x="80" y="590" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">• 在newstest2014测试集上验证</text>
  
  <text x="40" y="675" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="11" fill="#999999">数据来源：Newstest2014研究数据</text>
  <text x="40" y="700" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="13" font-weight="bold" fill="#003D7C">团结、进取、求实、创新</text>
  <text x="1240" y="700" text-anchor="end" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="13" fill="#999999">8 / 10</text>
</svg>