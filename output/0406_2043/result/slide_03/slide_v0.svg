<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="10" result="offsetBlur" />
      <feFlood flood-color="#003D7C" flood-opacity="0.15" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  
  <rect x="0" y="0" width="1280" height="2" fill="#003D7C" />
  
  <polygon points="60,35 95,35 85,65 50,65" fill="#003D7C" />
  
  <text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" fill="#003D7C" font-weight="bold" font-size="32" x="110" y="55">Transformer model revolutionizes NLP with attention</text><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" fill="#003D7C" font-weight="bold" font-size="32" x="110" y="56.2">mechanisms, enhancing efficiency and translation quality</text><path fill="#003D7C" fill-opacity="0.08" d="M66,135 H1214 A6,6 0 0 1 1220,141 V179 A6,6 0 0 1 1214,185 H66 A6,6 0 0 1 60,179 V141 A6,6 0 0 1 66,135 Z" />
  <text x="80" y="165" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#003D7C">▸ Transformer model enhances NLP efficiency and translation quality.</text>
  
  <path fill="#0056A4" filter="url(#shadow)" d="M66,215 H1214 A6,6 0 0 1 1220,221 V639 A6,6 0 0 1 1214,645 H66 A6,6 0 0 1 60,639 V221 A6,6 0 0 1 66,215 Z" />
  
  <text x="640" y="265" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="38" font-weight="bold" fill="#FFFFFF">Core Contribution</text>
  
  <line x1="440" y1="285" x2="840" y2="285" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.3" />
  
  <text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" fill="#FFFFFF" font-weight="bold" font-size="22" x="100" y="350">1. Proposed a novel architecture, the Transformer, based entirely on attention</text><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" fill="#FFFFFF" font-weight="bold" font-size="22" x="120" y="351.5">mechanisms.</text><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" fill="#FFFFFF" font-weight="bold" font-size="22" x="100" y="450">2. Eliminates the need for recurrence and convolution, enabling greater</text><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" fill="#FFFFFF" font-weight="bold" font-size="22" x="120" y="451.5">parallelization and efficiency.</text><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" fill="#FFFFFF" font-weight="bold" font-size="22" x="100" y="550">3. Achieves superior translation quality with reduced training time and</text><text font-family="Microsoft YaHei, SimHei, Arial, sans-serif" fill="#FFFFFF" font-weight="bold" font-size="22" x="120" y="551.5">computational resources.</text><line x1="60" y1="670" x2="1220" y2="670" stroke="#003D7C" stroke-width="1" />
  
  <text x="60" y="700" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="14" fill="#999999">团结、进取、求实、创新</text>
  
  <text x="1220" y="700" text-anchor="end" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="14" fill="#999999">3 / 10</text>
</svg>