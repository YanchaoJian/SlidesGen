  <text x="95" y="50" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="42" font-weight="bold" fill="#003D7C">Attention mechanism captures long-distance dependencies,</text>
  <text x="95" y="100" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="42" font-weight="bold" fill="#003D7C">demonstrating complex linguistic pattern learning</text>
  
  <path fill="#003D7C" fill-opacity="0.08" d="M48,130 H1232 A8,8 0 0 1 1240,138 V172 A8,8 0 0 1 1232,180 H48 A8,8 0 0 1 40,172 V138 A8,8 0 0 1 48,130 Z" />
  <text x="60" y="162" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#003D7C">▸ Attention mechanism captures long-distance dependencies effectively.</text>
  
  <path fill="#FFFFFF" filter="url(#shadow)" d="M48,210 H656 A8,8 0 0 1 664,218 V652 A8,8 0 0 1 656,660 H48 A8,8 0 0 1 40,652 V218 A8,8 0 0 1 48,210 Z" />
  
  <image href="output/0406_2043/images/_page_12_Figure_1.jpeg" x="52" y="222" width="600" height="400" preserveAspectRatio="xMidYMid meet" />
  
  <text x="352" y="640" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="13" fill="#333333">An example of the attention mechanism following long-distance dependencies</text>
  <text x="352" y="656" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="13" fill="#333333">in the encoder self-attention in layer 5 of 6.</text>
  
  <path fill="#0056A4" filter="url(#shadow)" d="M692,210 H1232 A8,8 0 0 1 1240,218 V652 A8,8 0 0 1 1232,660 H692 A8,8 0 0 1 684,652 V218 A8,8 0 0 1 692,210 Z" />
  
  <path fill="#003D7C" d="M692,210 H1232 A8,8 0 0 1 1240,218 V252 A8,8 0 0 1 1232,260 H692 A8,8 0 0 1 684,252 V218 A8,8 0 0 1 692,210 Z" />
  
  <text x="962" y="243" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">Insights</text>
  
  <text x="714" y="305" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">The attention mechanism captures</text>
  <text x="714" y="335" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">long-distance dependencies effectively.</text>
  
  <text x="714" y="405" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">Attention heads exhibit specialized</text>
  <text x="714" y="435" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">behaviors, such as resolving anaphora.</text>
  
  <text x="714" y="505" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">These insights demonstrate the model's</text>
  <text x="714" y="535" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">ability to learn complex linguistic patterns.</text>
  
