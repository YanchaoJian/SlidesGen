<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.1"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#003D7C"/>
  
  <!-- Decorative DUT Logo Background (10% opacity) -->
  <g opacity="0.1" filter="url(#logoGlow)">
    <circle cx="640" cy="360" r="180" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="640" cy="360" r="160" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="640" y="380" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF">DUT</text>
  </g>
  
  <!-- Main Title -->
  <text x="640" y="180" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF">Questions &amp; Discussion</text>
  
  <!-- Decorative Line -->
  <line x1="340" y1="215" x2="940" y2="215" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
  
  <!-- Thank You Message -->
  <text x="640" y="480" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">Thank you for your attention!</text>
  
  <!-- Feedback Message -->
  <text x="640" y="540" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="24" fill="#FFFFFF" opacity="0.85">Questions and feedback are welcome.</text>
  
  <!-- Decorative Elements -->
  <circle cx="180" cy="600" r="70" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="1100" cy="120" r="90" fill="#FFFFFF" opacity="0.04"/>
  
  <!-- Footer Slogan -->
  <text x="60" y="700" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="14" fill="#999999">团结、进取、求实、创新</text>
  
  <!-- Page Number -->
  <text x="1220" y="700" text-anchor="end" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="14" fill="#999999">11 / 11</text>
</svg>