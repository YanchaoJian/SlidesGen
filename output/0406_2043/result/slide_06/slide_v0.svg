  <text x="90" y="62" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="44" font-weight="bold" fill="#003D7C">Multi-head attention enhances model performance by capturing complex patterns</text>
  
  <path fill="#003D7C" fill-opacity="0.08" d="M46,80 H1234 A6,6 0 0 1 1240,86 V119 A6,6 0 0 1 1234,125 H46 A6,6 0 0 1 40,119 V86 A6,6 0 0 1 46,80 Z" />
  <text x="60" y="108" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#003D7C">▸ Multi-head attention captures complex patterns, improving model performance.</text>
  
  <line x1="40" y1="140" x2="1240" y2="140" stroke="#003D7C" stroke-width="1" />
  
  <path fill="#FFFFFF" filter="url(#shadow)" d="M48,160 H656 A8,8 0 0 1 664,168 V552 A8,8 0 0 1 656,560 H48 A8,8 0 0 1 40,552 V168 A8,8 0 0 1 48,160 Z" />
  <image href="file:///C:/Users/ADMINI~1/AppData/Local/Temp/output/0406_2043/images/_page_3_Figure_0.jpeg" x="52" y="172" width="600" height="360" preserveAspectRatio="xMidYMid meet" />
  
  <text x="352" y="552" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="13" fill="#666666">(left) Scaled Dot-Product Attention. (right) Multi-Head Attention consists of several</text>
  <text x="352" y="570" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="13" fill="#666666">attention layers running in parallel.</text>
  
  <path fill="#0056A4" filter="url(#shadow)" d="M692,160 H1232 A8,8 0 0 1 1240,168 V552 A8,8 0 0 1 1232,560 H692 A8,8 0 0 1 684,552 V168 A8,8 0 0 1 692,160 Z" />
  <path fill="#003D7C" d="M692,160 H1232 A8,8 0 0 1 1240,168 V216 A8,8 0 0 1 1232,224 H692 A8,8 0 0 1 684,216 V168 A8,8 0 0 1 692,160 Z" />
  <text x="962" y="200" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF">Multi-Head Attention</text>
  
  <text x="714" y="260" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">Multi-head attention allows the model to</text>
  <text x="714" y="288" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">jointly attend to information from different</text>
  <text x="714" y="316" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">representation subspaces.</text>
  
  <text x="714" y="364" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">Each head computes attention independently,</text>
  <text x="714" y="392" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">and the results are concatenated and linearly</text>
  <text x="714" y="420" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">transformed.</text>
  
  <text x="714" y="468" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">This mechanism improves the model's ability</text>
  <text x="714" y="496" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" fill="#FFFFFF">to capture complex patterns and dependencies.</text>
  
  <line x1="40" y1="660" x2="1240" y2="660" stroke="#003D7C" stroke-width="1" />
  
  <text x="60" y="690" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#999999">团结、进取、求实、创新</text>
  
  <text x="1220" y="690" text-anchor="end" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="14" fill="#999999">6 / 10</text>
</svg>