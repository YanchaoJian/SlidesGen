<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="10" result="offsetBlur" />
      <feFlood flood-color="#003D7C" flood-opacity="0.15" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  
  <rect x="0" y="0" width="1280" height="4" fill="#003D7C" />
  
  <polygon points="40,35 70,35 80,65 50,65" fill="#003D7C" />
  
  <text x="100" y="60" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="44" font-weight="bold" fill="#003D7C">Scaled dot-product attention enhances training stability</text>
  
  <path fill="#003D7C" fill-opacity="0.08" d="M46,80 H1234 A6,6 0 0 1 1240,86 V119 A6,6 0 0 1 1234,125 H46 A6,6 0 0 1 40,119 V86 A6,6 0 0 1 46,80 Z" />
  <text x="60" y="108" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="15" font-weight="bold" fill="#003D7C">▸ Prevents large values, ensuring stable gradients and efficient computation.</text>
  
  <path fill="#0056A4" filter="url(#shadow)" d="M66,155 H1214 A6,6 0 0 1 1220,161 V634 A6,6 0 0 1 1214,640 H66 A6,6 0 0 1 60,634 V161 A6,6 0 0 1 66,155 Z" />
  
  <text x="100" y="205" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="22" fill="#FFFFFF">The attention mechanism computes a weighted sum of values,</text>
  <text x="100" y="235" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="22" fill="#FFFFFF">where the weights are determined by the query and key vectors.</text>
  
  <text x="100" y="280" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="22" fill="#FFFFFF">Scaled dot-product attention prevents large values that could lead</text>
  <text x="100" y="310" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="22" fill="#FFFFFF">to small gradients, enhancing training stability.</text>
  
  <text x="100" y="365" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">The formula for attention is shown below:</text>
  
  <path fill="#EBF8FF" d="M106,390 H1174 A6,6 0 0 1 1180,396 V574 A6,6 0 0 1 1174,580 H106 A6,6 0 0 1 100,574 V396 A6,6 0 0 1 106,390 Z" />
  
  <text x="640" y="475" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="36" font-weight="bold" fill="#003D7C">Attention(Q, K, V ) = softmax(QK</text>
  <text x="1025" y="462" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#003D7C">T</text>
  <text x="1045" y="475" text-anchor="start" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="28" font-weight="bold" fill="#003D7C"> / √d</text>
  <text x="1115" y="483" text-anchor="start" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#003D7C">k</text>
  <text x="1130" y="475" text-anchor="start" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="36" font-weight="bold" fill="#003D7C">)V</text>
  
  <text x="640" y="530" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="18" fill="#333333">This formula describes the scaled dot-product attention mechanism,</text>
  <text x="640" y="555" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="18" fill="#333333">central to the Transformer's ability to compute attention scores efficiently.</text>
  
  <line x1="60" y1="660" x2="1220" y2="660" stroke="#003D7C" stroke-width="1" />
  
  <text x="60" y="690" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#999999">团结、进取、求实、创新</text>
  
  <text x="1240" y="690" text-anchor="end" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="14" fill="#999999">5 / 10</text>
</svg>