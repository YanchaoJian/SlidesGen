<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="0" dy="6" result="offsetBlur" />
      <feFlood flood-color="#003D7C" flood-opacity="0.15" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
  
  <rect x="0" y="0" width="1280" height="4" fill="#003D7C" />
  
  <polygon points="40,35 65,35 75,65 50,65" fill="#003D7C" />
  
  <text x="90" y="50" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="32" font-weight="bold" fill="#003D7C">Transformer Architecture Revolutionizes NLP with Self-Attention</text>
  
  <path fill="#003D7C" fill-opacity="0.08" d="M48,75 H1232 A8,8 0 0 1 1240,83 V117 A8,8 0 0 1 1232,125 H48 A8,8 0 0 1 40,117 V83 A8,8 0 0 1 48,75 Z" />
  <text x="60" y="105" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" font-weight="bold" fill="#003D7C">▸ Transformer's encoder-decoder and self-attention mechanisms are key to its success.</text>
  
  <path fill="#FFFFFF" filter="url(#shadow)" d="M48,150 H656 A8,8 0 0 1 664,158 V602 A8,8 0 0 1 656,610 H48 A8,8 0 0 1 40,602 V158 A8,8 0 0 1 48,150 Z" />
  <image href="output/0406_2043/images/_page_2_Figure_0.jpeg" x="52" y="162" width="600" height="436" preserveAspectRatio="xMidYMid meet" />
  
  <path fill="#0056A4" filter="url(#shadow)" d="M698,150 H1232 A8,8 0 0 1 1240,158 V602 A8,8 0 0 1 1232,610 H698 A8,8 0 0 1 690,602 V158 A8,8 0 0 1 698,150 Z" />
  <path fill="#003D7C" d="M698,150 H1232 A8,8 0 0 1 1240,158 V197 A8,8 0 0 1 1232,205 H698 A8,8 0 0 1 690,197 V158 A8,8 0 0 1 698,150 Z" />
  <text x="965" y="185" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">Transformer Overview</text>
  
  <text x="720" y="245" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="19" fill="#FFFFFF">The Transformer uses an encoder-decoder</text>
  <text x="720" y="275" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="19" fill="#FFFFFF">structure with stacked self-attention and</text>
  <text x="720" y="305" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="19" fill="#FFFFFF">point-wise, fully connected layers.</text>
  
  <text x="720" y="355" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="19" fill="#FFFFFF">Key components include multi-head</text>
  <text x="720" y="385" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="19" fill="#FFFFFF">attention, scaled dot-product attention,</text>
  <text x="720" y="415" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="19" fill="#FFFFFF">and position-wise feed-forward networks.</text>
  
  <text x="720" y="465" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="19" fill="#FFFFFF">Positional encodings are added to input</text>
  <text x="720" y="495" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="19" fill="#FFFFFF">embeddings to retain sequence order</text>
  <text x="720" y="525" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="19" fill="#FFFFFF">information.</text>
  
  <text x="352" y="635" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="13" fill="#666666">The Transformer - model architecture.</text>
  
  <text x="40" y="710" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="10" fill="#999999">Source: Dalian University of Technology</text>
  <text x="1240" y="710" text-anchor="end" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="12" fill="#999999">4 / 10</text>
</svg>