<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="#f8fafc" rx="12" />
  <rect x="30" y="30" width="740" height="390" fill="#ffffff" rx="10" filter="url(#shadow)"/>

  <text x="400" y="70" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle">各模型单页排版设计得分波动趋势图</text>
  <text x="400" y="90" font-size="12" fill="#64748b" text-anchor="middle">展示 18 页幻灯片生成过程中模型表现的稳定性 (0 - 5 分)</text>

  <!-- Y轴刻度与参考线 -->
  <line x1="80" y1="350" x2="740" y2="350" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="80" y1="110" x2="80" y2="350" stroke="#cbd5e1" stroke-width="2"/>

  <text x="65" y="355" font-size="12" fill="#64748b" text-anchor="end">0</text>
  <text x="65" y="307" font-size="12" fill="#64748b" text-anchor="end">1</text>
  <text x="65" y="259" font-size="12" fill="#64748b" text-anchor="end">2</text>
  <text x="65" y="211" font-size="12" fill="#64748b" text-anchor="end">3</text>
  <text x="65" y="163" font-size="12" fill="#64748b" text-anchor="end">4</text>
  <text x="65" y="115" font-size="12" fill="#64748b" text-anchor="end">5</text>

  <line x1="80" y1="302" x2="740" y2="302" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="254" x2="740" y2="254" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="206" x2="740" y2="206" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="158" x2="740" y2="158" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="110" x2="740" y2="110" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>

  <!-- X轴标签 -->
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="98" y="370">P1</text><text x="135" y="370">P2</text><text x="173" y="370">P3</text>
    <text x="210" y="370">P4</text><text x="248" y="370">P5</text><text x="285" y="370">P6</text>
    <text x="323" y="370">P7</text><text x="360" y="370">P8</text><text x="398" y="370">P9</text>
    <text x="435" y="370">P10</text><text x="473" y="370">P11</text><text x="510" y="370">P12</text>
    <text x="548" y="370">P13</text><text x="585" y="370">P14</text><text x="623" y="370">P15</text>
    <text x="660" y="370">P16</text><text x="698" y="370">P17</text><text x="735" y="370">P18</text>
  </g>

  <!-- GPT-5.4-Nano (蓝色 #3b82f6) 得分: 4,1,4,2,3,4,4,4,4,4,4,4,4,4,4,4,1,4 -->
  <polyline points="98,158 135,302 173,158 210,254 248,206 285,158 323,158 360,158 398,158 435,158 473,158 510,158 548,158 585,158 623,158 660,158 698,302 735,158" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="135" cy="302" r="3" fill="#3b82f6"/><circle cx="210" cy="254" r="3" fill="#3b82f6"/>
  <circle cx="248" cy="206" r="3" fill="#3b82f6"/><circle cx="698" cy="302" r="3" fill="#3b82f6"/>

  <!-- Gemini-2.5-Flash-Lite (绿色 #10b981) 得分: 4,3,4,3,4,4,4,4,4,4,4,4,4,4,4,4,4,4 -->
  <polyline points="98,158 135,206 173,158 210,206 248,158 285,158 323,158 360,158 398,158 435,158 473,158 510,158 548,158 585,158 623,158 660,158 698,158 735,158" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,2"/>
  <circle cx="135" cy="206" r="3" fill="#10b981"/><circle cx="210" cy="206" r="3" fill="#10b981"/>

  <!-- Claude-3-Haiku (橙色 #f59e0b) 得分: 4,3,4,2,0,4,4,4,4,4,4,4,4,4,4,4,2,4 -->
  <polyline points="98,158 135,206 173,158 210,254 248,350 285,158 323,158 360,158 398,158 435,158 473,158 510,158 548,158 585,158 623,158 660,158 698,254 735,158" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="2,4"/>
  <circle cx="248" cy="350" r="4" fill="#f59e0b"/><circle cx="698" cy="254" r="3" fill="#f59e0b"/>

  <!-- 图例图示 -->
  <line x1="280" y1="400" x2="310" y2="400" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="315" y="405" font-size="12" fill="#334155">GPT-5.4-Nano</text>
  
  <line x1="420" y1="400" x2="450" y2="400" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,2"/>
  <text x="455" y="405" font-size="12" fill="#334155">Gemini-2.5-Flash</text>
  
  <line x1="565" y1="400" x2="595" y2="400" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="2,4"/>
  <text x="600" y="405" font-size="12" fill="#334155">Claude-3-Haiku</text>

</svg>
