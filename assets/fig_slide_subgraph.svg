<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#475569">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#DC2626">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-amber" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#D97706">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
  </defs>

  <rect width="1100" height="580" fill="#FAFBFE" rx="6"/>

  <!-- 标题 -->
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">单页幻灯片生成子图 (Slide Subgraph)</text>
  <text x="550" y="54" text-anchor="middle" font-size="12" fill="#64748B">每页 Slide 独立运行 · SVG 生成 → 验证/优化 → 设计检查 · 含双重重试循环</text>

  <!-- 外框：子图边界 -->
  <rect x="40" y="72" width="1020" height="490" rx="14" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
  <text x="60" y="92" font-size="11" font-weight="600" fill="#059669">SlideState 子图 (compiled subgraph)</text>

  <!-- ================================================================== -->
  <!-- START -->
  <!-- ================================================================== -->
  <circle cx="130" cy="190" r="20" fill="#1E293B"/>
  <text x="130" y="195" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">START</text>

  <line x1="150" y1="190" x2="195" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ================================================================== -->
  <!-- Node 1: expand_slide_plan -->
  <!-- ================================================================== -->
  <rect x="200" y="164" width="175" height="52" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="288" y="187" text-anchor="middle" font-size="12" font-weight="600" fill="#5B21B6">expand_slide_plan</text>
  <text x="288" y="204" text-anchor="middle" font-size="10" fill="#7C3AED">大纲扩展 · LLM 细化布局</text>

  <!-- 输入标注 -->
  <rect x="200" y="120" width="175" height="32" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="288" y="135" text-anchor="middle" font-size="9" fill="#64748B">输入: slide_plan + style_protocol</text>
  <text x="288" y="147" text-anchor="middle" font-size="9" fill="#94A3B8">输出: slide_detail (详细描述)</text>

  <line x1="375" y1="190" x2="425" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ================================================================== -->
  <!-- Node 2: generate_slide_svg -->
  <!-- ================================================================== -->
  <rect x="430" y="164" width="175" height="52" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="518" y="187" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">generate_slide_svg</text>
  <text x="518" y="204" text-anchor="middle" font-size="10" fill="#059669">LLM 生成 SVG 代码</text>

  <line x1="605" y1="190" x2="655" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ================================================================== -->
  <!-- Node 3: optimize_svg_crap -->
  <!-- ================================================================== -->
  <rect x="660" y="152" width="195" height="76" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="758" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">optimize_svg_crap</text>
  <line x1="675" y1="185" x2="840" y2="185" stroke="#D97706" stroke-width="0.8" opacity="0.4"/>
  <text x="758" y="200" text-anchor="middle" font-size="10" fill="#B45309">① XML 验证 + 禁用特性检查</text>
  <text x="758" y="214" text-anchor="middle" font-size="10" fill="#B45309">② 几何越界/重叠检测</text>
  <text x="758" y="228" text-anchor="middle" font-size="10" fill="#B45309" font-style="italic">③ CRAP 设计原则优化</text>

  <!-- ================================================================== -->
  <!-- 条件路由 1: route_svg_crap_check -->
  <!-- ================================================================== -->
  <!-- 菱形 -->
  <polygon points="758,260 790,290 758,320 726,290" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="758" y="287" text-anchor="middle" font-size="9" font-weight="600" fill="#92400E">验证</text>
  <text x="758" y="299" text-anchor="middle" font-size="9" font-weight="600" fill="#92400E">通过?</text>

  <line x1="758" y1="228" x2="758" y2="260" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 验证失败 → 回到 generate_slide_svg (重试循环 1) -->
  <path d="M 726,290 Q 650,290 518,260 Q 480,250 480,216" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>

  <!-- 重试标注框 -->
  <rect x="530" y="258" width="156" height="38" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="608" y="273" text-anchor="middle" font-size="10" font-weight="600" fill="#DC2626">SVG 验证重试循环</text>
  <text x="608" y="288" text-anchor="middle" font-size="9" fill="#EF4444">retry_count &lt; llm_max_retries</text>

  <!-- 验证失败且超限 → END -->
  <path d="M 726,290 Q 670,290 670,340 Q 670,370 680,390" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="630" y="346" font-size="9" fill="#DC2626">超限</text>

  <circle cx="690" cy="410" r="18" fill="#1E293B"/>
  <circle cx="690" cy="410" r="14" fill="none" stroke="#FFF" stroke-width="2"/>
  <text x="690" y="414" text-anchor="middle" font-size="9" font-weight="700" fill="#FFF">END</text>
  <text x="690" y="438" text-anchor="middle" font-size="9" fill="#94A3B8">放弃该页</text>

  <!-- 验证通过 → check_slide_design -->
  <line x1="790" y1="290" x2="872" y2="290" stroke="#059669" stroke-width="2" marker-end="url(#arr)"/>
  <text x="830" y="282" font-size="9" fill="#059669" font-weight="500">通过 ✓</text>

  <!-- ================================================================== -->
  <!-- Node 4: check_slide_design -->
  <!-- ================================================================== -->
  <rect x="877" y="264" width="155" height="52" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="955" y="287" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">check_slide_design</text>
  <text x="955" y="303" text-anchor="middle" font-size="10" fill="#3B82F6">VLM 视觉设计评审</text>

  <!-- ================================================================== -->
  <!-- 条件路由 2: route_slide_design_check -->
  <!-- ================================================================== -->
  <polygon points="955,348 987,378 955,408 923,378" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="955" y="375" text-anchor="middle" font-size="9" font-weight="600" fill="#1E40AF">设计</text>
  <text x="955" y="387" text-anchor="middle" font-size="9" font-weight="600" fill="#1E40AF">合格?</text>

  <line x1="955" y1="316" x2="955" y2="348" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 设计不合格 → 回到 generate_slide_svg (重试循环 2) -->
  <path d="M 923,378 Q 860,378 750,420 Q 600,465 518,280 Q 505,250 510,216" fill="none" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>

  <!-- 重试标注框 -->
  <rect x="555" y="430" width="156" height="38" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="633" y="445" text-anchor="middle" font-size="10" font-weight="600" fill="#DC2626">设计审查重试循环</text>
  <text x="633" y="460" text-anchor="middle" font-size="9" fill="#EF4444">retry_count &lt; llm_max_retries</text>

  <!-- 设计合格 → END -->
  <line x1="987" y1="378" x2="1030" y2="378" stroke="#059669" stroke-width="2"/>
  <text x="1005" y="370" font-size="9" fill="#059669" font-weight="500">合格 ✓</text>

  <circle cx="1050" cy="378" r="20" fill="#1E293B"/>
  <circle cx="1050" cy="378" r="16" fill="none" stroke="#FFF" stroke-width="2"/>
  <text x="1050" y="383" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">END</text>

  <!-- 设计不合格且超限 → END (接受最后版本) -->
  <path d="M 955,408 Q 955,440 1020,440 Q 1050,440 1050,398" fill="none" stroke="#D97706" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-amber)"/>
  <text x="1000" y="454" font-size="9" fill="#D97706">超限 · 接受末版</text>

  <!-- ================================================================== -->
  <!-- 输出标注 -->
  <!-- ================================================================== -->
  <rect x="900" y="475" width="155" height="68" rx="8" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1"/>
  <text x="978" y="493" text-anchor="middle" font-size="10" font-weight="600" fill="#065F46">子图输出</text>
  <text x="978" y="510" text-anchor="middle" font-size="9" fill="#059669">generated_slide_paths</text>
  <text x="978" y="524" text-anchor="middle" font-size="9" fill="#059669">slide_reports (冒泡到主图)</text>
  <text x="978" y="538" text-anchor="middle" font-size="9" fill="#64748B">→ Reducer: _merge_slide_paths</text>

  <!-- ================================================================== -->
  <!-- 底部说明 -->
  <!-- ================================================================== -->
  <rect x="60" y="484" width="430" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="80" y="503" font-size="11" font-weight="600" fill="#334155">重试策略说明</text>
  <text x="80" y="519" font-size="10" fill="#64748B">• 统一重试上限: --llm_max_retries (默认 3)</text>
  <text x="80" y="535" font-size="10" fill="#64748B">• SVG 验证失败与设计不合格共享同一个重试计数器</text>
</svg>