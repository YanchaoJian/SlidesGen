<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#475569">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#059669">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#DC2626">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#2563EB">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#FAFBFE" rx="6"/>

  <!-- 标题 -->
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">会话恢复与检查点机制</text>
  <text x="600" y="54" text-anchor="middle" font-size="12" fill="#64748B">Session Resumption — AsyncSqliteSaver Checkpointing + interrupt() Recovery</text>

  <!-- ================================================================== -->
  <!-- 上半部分：正常执行流程 -->
  <!-- ================================================================== -->
  <rect x="40" y="72" width="1120" height="220" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="96" font-size="14" font-weight="700" fill="#1E40AF">场景 A: 首次执行 (新建会话)</text>

  <!-- 用户启动 -->
  <rect x="60" y="114" width="160" height="50" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="140" y="136" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">python main.py</text>
  <text x="140" y="152" text-anchor="middle" font-size="9" fill="#64748B">--pdf_path paper.pdf</text>

  <line x1="220" y1="139" x2="258" y2="139" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 生成 session_id -->
  <rect x="262" y="110" width="175" height="58" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="350" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">生成 Session ID</text>
  <text x="350" y="148" text-anchor="middle" font-size="9" fill="#3B82F6" font-family="Consolas, monospace">MMDD_HHMM_{model}</text>
  <text x="350" y="162" text-anchor="middle" font-size="8" fill="#64748B">例: 0412_1530_gpt-4o</text>

  <line x1="437" y1="139" x2="473" y2="139" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 创建目录 + checkpoint DB -->
  <rect x="477" y="110" width="175" height="58" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="565" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">初始化存储</text>
  <text x="565" y="146" text-anchor="middle" font-size="9" fill="#059669">output/{session_id}/</text>
  <text x="565" y="160" text-anchor="middle" font-size="9" fill="#059669">checkpoints/checkpoints.sqlite</text>

  <line x1="652" y1="139" x2="688" y2="139" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 工作流执行 -->
  <rect x="692" y="106" width="180" height="66" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="782" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#5B21B6">graph.astream()</text>
  <text x="782" y="142" text-anchor="middle" font-size="9" fill="#7C3AED">异步流式执行工作流</text>
  <text x="782" y="156" text-anchor="middle" font-size="9" fill="#7C3AED">每个节点完成后</text>
  <text x="782" y="168" text-anchor="middle" font-size="9" font-weight="600" fill="#7C3AED">自动写入 checkpoint</text>

  <!-- Checkpoint 写入 -->
  <line x1="782" y1="172" x2="782" y2="195" stroke="#059669" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="710" y="198" width="144" height="28" rx="6" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1"/>
  <text x="782" y="216" text-anchor="middle" font-size="9" fill="#059669">AsyncSqliteSaver</text>

  <!-- interrupt 发生 -->
  <line x1="872" y1="139" x2="908" y2="139" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="912" y="110" width="130" height="58" rx="24" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,3" filter="url(#shadow)"/>
  <text x="977" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#DC2626">interrupt()</text>
  <text x="977" y="152" text-anchor="middle" font-size="9" fill="#EF4444">等待用户输入</text>
  <text x="977" y="164" text-anchor="middle" font-size="8" fill="#EF4444">或用户中断 (Ctrl+C)</text>

  <!-- 中断标记 -->
  <line x1="1042" y1="139" x2="1080" y2="139" stroke="#DC2626" stroke-width="2"/>
  <text x="1085" y="134" font-size="18" fill="#DC2626" font-weight="700">⚡</text>
  <text x="1085" y="160" font-size="9" fill="#DC2626">执行暂停</text>

  <!-- 时间线 -->
  <line x1="60" y1="250" x2="1100" y2="250" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="580" y="266" text-anchor="middle" font-size="10" fill="#94A3B8">⸻ 中断 · 用户离开 · 程序退出 ⸻</text>

  <!-- ================================================================== -->
  <!-- 下半部分：恢复执行流程 -->
  <!-- ================================================================== -->
  <rect x="40" y="282" width="1120" height="220" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="306" font-size="14" font-weight="700" fill="#065F46">场景 B: 恢复执行 (断点续跑)</text>

  <!-- 用户恢复 -->
  <rect x="60" y="322" width="200" height="58" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.3"/>
  <text x="160" y="342" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">python main.py</text>
  <text x="160" y="356" text-anchor="middle" font-size="9" fill="#64748B">--thread_id 0412_1530_gpt-4o</text>
  <text x="160" y="370" text-anchor="middle" font-size="9" fill="#059669" font-weight="500">传入完整 session ID</text>

  <line x1="260" y1="351" x2="298" y2="351" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 加载 checkpoint -->
  <rect x="302" y="322" width="175" height="58" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="342" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">加载 Checkpoint</text>
  <text x="390" y="358" text-anchor="middle" font-size="9" fill="#059669">读取 SQLite 存档</text>
  <text x="390" y="372" text-anchor="middle" font-size="9" fill="#059669">还原完整 State 快照</text>

  <line x1="477" y1="351" x2="513" y2="351" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- initial_state = None -->
  <rect x="517" y="326" width="160" height="50" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.3"/>
  <text x="597" y="348" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">initial_state = None</text>
  <text x="597" y="364" text-anchor="middle" font-size="9" fill="#B45309">跳过初始化步骤</text>

  <line x1="677" y1="351" x2="713" y2="351" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 从断点继续 -->
  <rect x="717" y="318" width="180" height="66" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="807" y="340" text-anchor="middle" font-size="11" font-weight="600" fill="#5B21B6">从断点继续执行</text>
  <text x="807" y="358" text-anchor="middle" font-size="9" fill="#7C3AED">graph.astream(None, config)</text>
  <text x="807" y="374" text-anchor="middle" font-size="9" fill="#7C3AED">自动跳到上次中断的节点</text>

  <line x1="897" y1="351" x2="933" y2="351" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Command(resume=) -->
  <rect x="937" y="322" width="165" height="58" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1020" y="344" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">Command(resume=)</text>
  <text x="1020" y="360" text-anchor="middle" font-size="9" fill="#3B82F6">用户输入作为恢复值</text>
  <text x="1020" y="374" text-anchor="middle" font-size="9" fill="#3B82F6">传递给 interrupt 节点</text>

  <!-- 继续标记 -->
  <line x1="807" y1="384" x2="807" y2="420" stroke="#059669" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="730" y="424" width="154" height="28" rx="6" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1"/>
  <text x="807" y="443" text-anchor="middle" font-size="9" fill="#059669" font-weight="500">后续节点继续 checkpoint</text>

  <!-- 成功箭头到完成 -->
  <line x1="807" y1="452" x2="807" y2="470" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="755" y="474" width="104" height="24" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.3"/>
  <text x="807" y="490" text-anchor="middle" font-size="10" font-weight="600" fill="#065F46">执行完成 ✓</text>

  <!-- ================================================================== -->
  <!-- 底部：存储结构 -->
  <!-- ================================================================== -->
  <rect x="40" y="516" width="540" height="108" rx="12" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="516" width="540" height="30" rx="12" fill="#475569"/>
  <rect x="40" y="540" width="540" height="6" fill="#475569"/>
  <text x="310" y="538" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">会话目录结构</text>

  <text x="60" y="568" font-size="11" fill="#475569" font-family="Consolas, monospace">output/0412_1530_gpt-4o/</text>
  <text x="80" y="584" font-size="10" fill="#64748B" font-family="Consolas, monospace">├── plan/          # 大纲、论文内容 JSON</text>
  <text x="80" y="598" font-size="10" fill="#64748B" font-family="Consolas, monospace">├── raw/           # PDF 提取原始内容</text>
  <text x="80" y="612" font-size="10" fill="#64748B" font-family="Consolas, monospace">├── style/         # 风格协议与批评</text>
  <text x="355" y="568" font-size="10" fill="#64748B" font-family="Consolas, monospace">├── result/        # SVG + PPTX 产物</text>
  <text x="355" y="584" font-size="10" fill="#059669" font-family="Consolas, monospace" font-weight="600">├── checkpoints/   # SQLite 检查点 ★</text>
  <text x="355" y="600" font-size="10" fill="#64748B" font-family="Consolas, monospace">└── final_snapshot.json</text>

  <!-- ================================================================== -->
  <!-- 底部右侧：关键设计决策 -->
  <!-- ================================================================== -->
  <rect x="620" y="516" width="540" height="108" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="620" y="516" width="540" height="30" rx="12" fill="#D97706"/>
  <rect x="620" y="540" width="540" height="6" fill="#D97706"/>
  <text x="890" y="538" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">关键设计要点</text>

  <text x="640" y="568" font-size="10" fill="#475569">1. 每个节点执行完毕后，LangGraph 自动将完整 State 持久化到 SQLite</text>
  <text x="640" y="586" font-size="10" fill="#475569">2. 两个 interrupt() 检查点: review_plan (大纲审查) + review_pptx_design (PPTX 审查)</text>
  <text x="640" y="604" font-size="10" fill="#475569">3. 恢复时 initial_state=None，完全依赖 checkpoint 还原，无需重复 PDF 解析</text>
  <text x="640" y="622" font-size="10" fill="#475569">4. Session ID 格式: MMDD_HHMM_{model_name}，斜杠自动替换为下划线</text>
</svg>