<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 810" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#475569">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#DC2626">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#2563EB">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-purple" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#7C3AED">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#059669">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
  </defs>

  <rect width="1280" height="810" fill="#FAFBFE" rx="6"/>

  <!-- 标题 -->
  <text x="640" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1E293B">LangGraph 工作流有向无环图</text>
  <text x="640" y="56" text-anchor="middle" font-size="13" fill="#64748B">Workflow Directed Acyclic Graph (with conditional edges &amp; HITL checkpoints)</text>

  <!-- 图例 -->
  <rect x="30" y="68" width="350" height="28" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="45" y1="82" x2="75" y2="82" stroke="#475569" stroke-width="2"/>
  <text x="80" y="86" font-size="10" fill="#475569">普通边</text>
  <line x1="125" y1="82" x2="155" y2="82" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="160" y="86" font-size="10" fill="#DC2626">条件边</text>
  <line x1="210" y1="82" x2="240" y2="82" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="245" y="86" font-size="10" fill="#059669">Send() 并行</text>
  <circle cx="310" cy="82" r="6" fill="none" stroke="#EF4444" stroke-width="2"/>
  <text x="322" y="86" font-size="10" fill="#EF4444">interrupt()</text>

  <!-- ================================================================== -->
  <!-- START 节点 -->
  <!-- ================================================================== -->
  <circle cx="420" cy="130" r="22" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <text x="420" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">START</text>

  <!-- START 分叉 -->
  <line x1="398" y1="130" x2="230" y2="130" stroke="#475569" stroke-width="2"/>
  <line x1="230" y1="130" x2="230" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <line x1="442" y1="130" x2="610" y2="130" stroke="#475569" stroke-width="2"/>
  <line x1="610" y1="130" x2="610" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ================================================================== -->
  <!-- Pipeline A (左): 内容流水线 -->
  <!-- ================================================================== -->
  <rect x="26" y="104" width="14" height="300" rx="7" fill="#3B82F6" opacity="0.15"/>
  <text x="16" y="260" font-size="11" font-weight="600" fill="#3B82F6" transform="rotate(-90,16,260)">Pipeline A (Content)</text>

  <!-- extract_content_from_pdf -->
  <rect x="145" y="184" width="170" height="48" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="230" y="207" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">extract_content_from_pdf</text>
  <text x="230" y="222" text-anchor="middle" font-size="10" fill="#3B82F6">PDF 内容提取</text>

  <line x1="230" y1="232" x2="230" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- generate_presentation_plan -->
  <rect x="135" y="272" width="190" height="48" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="230" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#5B21B6">generate_presentation_plan</text>
  <text x="230" y="310" text-anchor="middle" font-size="10" fill="#7C3AED">生成演示大纲</text>

  <line x1="230" y1="320" x2="230" y2="356" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- review_plan (HITL) -->
  <rect x="160" y="360" width="140" height="48" rx="24" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="230" y="383" text-anchor="middle" font-size="12" font-weight="600" fill="#DC2626">review_plan</text>
  <text x="230" y="398" text-anchor="middle" font-size="10" fill="#EF4444">interrupt() 大纲审查</text>

  <!-- review_plan 条件边: 未通过 → generate_presentation_plan -->
  <path d="M 160,384 Q 80,384 80,296 Q 80,272 135,284" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="60" y="340" font-size="9" fill="#DC2626" font-weight="500">未通过</text>

  <!-- review_plan 条件边: 通过 → dispatch -->
  <line x1="230" y1="408" x2="230" y2="428" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="230" y1="428" x2="420" y2="428" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="420" y1="428" x2="420" y2="462" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="310" y="422" font-size="9" fill="#059669" font-weight="500">通过 ✓</text>

  <!-- ================================================================== -->
  <!-- Pipeline B (右): 风格流水线 -->
  <!-- ================================================================== -->
  <rect x="770" y="104" width="14" height="300" rx="7" fill="#0891B2" opacity="0.15"/>
  <text x="800" y="260" font-size="11" font-weight="600" fill="#0891B2" transform="rotate(-90,800,260)">Pipeline B (Style)</text>

  <!-- analyze_image_style -->
  <rect x="525" y="184" width="170" height="48" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="610" y="207" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">analyze_image_style</text>
  <text x="610" y="222" text-anchor="middle" font-size="10" fill="#3B82F6">视觉风格分析</text>

  <line x1="610" y1="232" x2="610" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- check_style_protocol -->
  <rect x="525" y="272" width="170" height="48" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="610" y="295" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">check_style_protocol</text>
  <text x="610" y="310" text-anchor="middle" font-size="10" fill="#3B82F6">风格协议自查</text>

  <!-- check_style 条件边: 未通过 → analyze_image_style -->
  <path d="M 695,296 Q 760,296 760,208 Q 760,184 695,208" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <text x="775" y="254" font-size="9" fill="#2563EB" font-weight="500">未通过</text>

  <!-- check_style 条件边: 通过 → dispatch -->
  <line x1="610" y1="320" x2="610" y2="440" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="610" y1="440" x2="420" y2="440" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="530" y="434" font-size="9" fill="#059669" font-weight="500">通过 ✓</text>

  <!-- ================================================================== -->
  <!-- 汇合: dispatch_slide_tasks (defer=True) -->
  <!-- ================================================================== -->
  <rect x="340" y="466" width="160" height="44" rx="8" fill="#F0FDF4" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="420" y="486" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">dispatch_slide_tasks</text>
  <text x="420" y="500" text-anchor="middle" font-size="9" fill="#059669">defer=True | Fan-out</text>

  <!-- Send() 并行分发 -->
  <line x1="420" y1="510" x2="420" y2="535" stroke="#059669" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- 并行 slide 子图 -->
  <line x1="420" y1="535" x2="180" y2="535" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="420" y1="535" x2="660" y2="535" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="180" y1="535" x2="180" y2="555" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>
  <line x1="420" y1="535" x2="420" y2="555" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>
  <line x1="660" y1="535" x2="660" y2="555" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>

  <!-- Slide 子图盒子 -->
  <rect x="115" y="559" width="130" height="40" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="576" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">Slide 1 子图</text>
  <text x="180" y="591" text-anchor="middle" font-size="9" fill="#059669">generate_single_slide</text>

  <rect x="355" y="559" width="130" height="40" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="420" y="576" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">Slide 2 子图</text>
  <text x="420" y="591" text-anchor="middle" font-size="9" fill="#059669">generate_single_slide</text>

  <rect x="595" y="559" width="130" height="40" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="576" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">Slide N 子图</text>
  <text x="660" y="591" text-anchor="middle" font-size="9" fill="#059669">generate_single_slide</text>

  <text x="300" y="583" text-anchor="middle" font-size="16" fill="#94A3B8">···</text>
  <text x="540" y="583" text-anchor="middle" font-size="16" fill="#94A3B8">···</text>

  <!-- 标注 Send() -->
  <rect x="810" y="540" width="140" height="36" rx="6" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1"/>
  <text x="880" y="556" text-anchor="middle" font-size="10" fill="#059669" font-weight="500">Send("generate_single_slide")</text>
  <text x="880" y="570" text-anchor="middle" font-size="9" fill="#64748B">Map-Reduce 并行模式</text>

  <!-- Fan-in -->
  <line x1="180" y1="599" x2="180" y2="618" stroke="#059669" stroke-width="1.5"/>
  <line x1="420" y1="599" x2="420" y2="618" stroke="#059669" stroke-width="1.5"/>
  <line x1="660" y1="599" x2="660" y2="618" stroke="#059669" stroke-width="1.5"/>
  <line x1="180" y1="618" x2="660" y2="618" stroke="#059669" stroke-width="1.5"/>
  <line x1="420" y1="618" x2="420" y2="638" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- merge_slides_to_deck -->
  <rect x="330" y="642" width="180" height="44" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="420" y="662" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">merge_slides_to_deck</text>
  <text x="420" y="677" text-anchor="middle" font-size="9" fill="#D97706">defer=True | SVG→PPTX 合并</text>

  <line x1="420" y1="686" x2="420" y2="712" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- review_pptx_design (HITL) -->
  <rect x="345" y="716" width="150" height="48" rx="24" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="420" y="738" text-anchor="middle" font-size="12" font-weight="600" fill="#DC2626">review_pptx_design</text>
  <text x="420" y="753" text-anchor="middle" font-size="10" fill="#EF4444">interrupt() PPTX 审查</text>

  <!-- review_pptx 条件边: 通过 → END -->
  <line x1="495" y1="740" x2="560" y2="740" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>

  <!-- END 节点 -->
  <circle cx="585" cy="740" r="22" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <circle cx="585" cy="740" r="18" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="585" y="745" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">END</text>

  <!-- review_pptx 条件边: global_style → analyze_image_style -->
  <path d="M 420,716 Q 420,700 950,700 Q 1020,700 1020,208 Q 1020,184 695,208" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="1035" y="460" font-size="9" fill="#DC2626" font-weight="500" transform="rotate(-90,1035,460)">global_style</text>

  <!-- review_pptx 条件边: global_plan → generate_presentation_plan -->
  <path d="M 345,740 Q 50,740 50,296 Q 50,272 135,284" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="36" y="520" font-size="9" fill="#DC2626" font-weight="500" transform="rotate(-90,36,520)">global_plan</text>

  <!-- review_pptx 条件边: local → dispatch -->
  <path d="M 345,740 Q 310,740 310,680 Q 310,620 350,580 Q 360,560 358,510 Q 358,488 340,488" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="295" y="620" font-size="9" fill="#DC2626" font-weight="500">local</text>

  <!-- review_pptx 条件边: ambiguous → 自循环 -->
  <path d="M 470,760 Q 530,780 530,740 Q 530,720 495,730" fill="none" stroke="#DC2626" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="538" y="775" font-size="9" fill="#DC2626" font-weight="500">ambiguous</text>
</svg>