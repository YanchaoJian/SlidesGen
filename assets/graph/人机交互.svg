<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#475569">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#DC2626">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#059669">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#2563EB">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-purple" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#7C3AED">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-amber" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#D97706">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#FAFBFE" rx="6"/>

  <!-- 标题 -->
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">人机交互反馈路由机制</text>
  <text x="600" y="54" text-anchor="middle" font-size="12" fill="#64748B">Human-in-the-Loop Feedback Routing — review_pptx_design_node → analyze_feedback → conditional routing</text>

  <!-- ================================================================== -->
  <!-- 第一行：用户交互入口 -->
  <!-- ================================================================== -->

  <!-- 用户图标 -->
  <circle cx="120" cy="130" r="28" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="120" cy="118" r="10" fill="#64748B"/>
  <path d="M 100,145 Q 100,132 120,132 Q 140,132 140,145" fill="#64748B"/>
  <text x="120" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">用户</text>

  <!-- 用户输入 -->
  <line x1="148" y1="130" x2="195" y2="130" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="172" y="122" text-anchor="middle" font-size="9" fill="#64748B">输入反馈</text>

  <!-- PPTX 审查节点 -->
  <rect x="200" y="100" width="200" height="60" rx="24" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="300" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#DC2626">review_pptx_design</text>
  <text x="300" y="146" text-anchor="middle" font-size="10" fill="#EF4444">interrupt() — 等待用户反馈</text>

  <!-- 两种情况 -->
  <line x1="400" y1="120" x2="470" y2="120" stroke="#475569" stroke-width="1.8"/>

  <!-- 分支点 -->
  <circle cx="475" cy="120" r="5" fill="#475569"/>

  <!-- 用户批准分支 -->
  <line x1="475" y1="120" x2="560" y2="70" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <rect x="565" y="48" width="170" height="44" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="650" y="68" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">pptx_review.verified</text>
  <text x="650" y="84" text-anchor="middle" font-size="10" fill="#059669">用户批准 → 直接结束</text>

  <line x1="735" y1="70" x2="800" y2="70" stroke="#059669" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- END -->
  <circle cx="830" cy="70" r="22" fill="#1E293B"/>
  <circle cx="830" cy="70" r="17" fill="none" stroke="#FFF" stroke-width="2"/>
  <text x="830" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">END</text>

  <!-- 用户提出修改意见 -->
  <line x1="475" y1="120" x2="560" y2="170" stroke="#D97706" stroke-width="1.8" marker-end="url(#arr-amber)"/>

  <rect x="565" y="148" width="170" height="44" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="650" y="168" text-anchor="middle" font-size="12" font-weight="600" fill="#92400E">pptx_review.critique</text>
  <text x="650" y="184" text-anchor="middle" font-size="10" fill="#D97706">存储原始用户反馈文本</text>

  <!-- ================================================================== -->
  <!-- 第二行：LLM 反馈分析 -->
  <!-- ================================================================== -->
  <line x1="650" y1="192" x2="650" y2="238" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- analyze_feedback 框 -->
  <rect x="510" y="242" width="280" height="80" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#5B21B6">analyze_feedback()</text>
  <text x="650" y="288" text-anchor="middle" font-size="10" fill="#7C3AED">LLM 结构化输出 → FeedbackAnalysis</text>
  <text x="650" y="304" text-anchor="middle" font-size="10" fill="#7C3AED">with_structured_output(Pydantic Model)</text>

  <!-- FeedbackAnalysis 模型说明 -->
  <rect x="830" y="242" width="340" height="80" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="850" y="262" font-size="11" font-weight="600" fill="#334155">FeedbackAnalysis (Pydantic BaseModel)</text>
  <line x1="845" y1="269" x2="1155" y2="269" stroke="#E2E8F0" stroke-width="1"/>
  <text x="850" y="286" font-size="10" fill="#475569" font-family="Consolas, monospace">scope: Literal["local","global_style",</text>
  <text x="850" y="300" font-size="10" fill="#475569" font-family="Consolas, monospace">       "global_plan","ambiguous"]</text>
  <text x="850" y="316" font-size="10" fill="#475569" font-family="Consolas, monospace">target_pages: List[int]  # scope=local 时</text>

  <!-- ================================================================== -->
  <!-- 第三行：scope 分类结果 → 写入 state -->
  <!-- ================================================================== -->
  <line x1="650" y1="322" x2="650" y2="360" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="540" y="364" width="220" height="40" rx="8" fill="#F0FDF4" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="382" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">写入 pptx_feedback_scope</text>
  <text x="650" y="396" text-anchor="middle" font-size="9" fill="#059669">与 critique 解耦 · 独立状态字段</text>

  <!-- ================================================================== -->
  <!-- 第四行：四路条件路由 -->
  <!-- ================================================================== -->
  <line x1="650" y1="404" x2="650" y2="436" stroke="#475569" stroke-width="1.8"/>

  <!-- 路由菱形 -->
  <polygon points="650,440 695,475 650,510 605,475" fill="#FFFBEB" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="472" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">route</text>
  <text x="650" y="485" text-anchor="middle" font-size="9" font-weight="600" fill="#92400E">scope?</text>

  <!-- ================================================================== -->
  <!-- 路由分支 1: local -->
  <!-- ================================================================== -->
  <line x1="605" y1="475" x2="88" y2="475" stroke="#059669" stroke-width="2"/>
  <line x1="88" y1="475" x2="88" y2="530" stroke="#059669" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="30" y="534" width="240" height="170" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="534" width="240" height="30" rx="12" fill="#059669"/>
  <rect x="30" y="556" width="240" height="8" fill="#059669"/>
  <text x="150" y="556" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">local — 局部重生成</text>

  <text x="50" y="582" font-size="11" font-weight="600" fill="#065F46">目标:</text>
  <text x="50" y="598" font-size="10" fill="#475569">仅重新生成指定页面的 SVG</text>

  <text x="50" y="620" font-size="11" font-weight="600" fill="#065F46">操作:</text>
  <text x="50" y="636" font-size="10" fill="#475569">1. target_pages → retry_slide_pages</text>
  <text x="50" y="652" font-size="10" fill="#475569">2. → dispatch_slide_tasks</text>
  <text x="50" y="668" font-size="10" fill="#475569">3. 仅 Send() 目标页的子图</text>

  <text x="50" y="692" font-size="9" fill="#94A3B8" font-style="italic">例: "第3页的图片太小了"</text>

  <!-- ================================================================== -->
  <!-- 路由分支 2: global_style -->
  <!-- ================================================================== -->
  <line x1="650" y1="510" x2="380" y2="570" stroke="#3B82F6" stroke-width="2"/>
  <line x1="380" y1="570" x2="380" y2="600" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="295" y="604" width="240" height="108" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="295" y="604" width="240" height="30" rx="12" fill="#3B82F6"/>
  <rect x="295" y="626" width="240" height="8" fill="#3B82F6"/>
  <text x="415" y="626" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">global_style — 全局风格</text>

  <text x="315" y="652" font-size="11" font-weight="600" fill="#1E40AF">目标:</text>
  <text x="315" y="668" font-size="10" fill="#475569">重新分析风格 → 重生成全部</text>

  <text x="315" y="690" font-size="11" font-weight="600" fill="#1E40AF">路由:</text>
  <text x="315" y="706" font-size="10" fill="#475569">→ analyze_image_style 节点</text>

  <!-- ================================================================== -->
  <!-- 路由分支 3: global_plan -->
  <!-- ================================================================== -->
  <line x1="650" y1="510" x2="660" y2="600" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr-purple)"/>

  <rect x="570" y="604" width="240" height="108" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <rect x="570" y="604" width="240" height="30" rx="12" fill="#7C3AED"/>
  <rect x="570" y="626" width="240" height="8" fill="#7C3AED"/>
  <text x="690" y="626" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">global_plan — 全局大纲</text>

  <text x="590" y="652" font-size="11" font-weight="600" fill="#5B21B6">目标:</text>
  <text x="590" y="668" font-size="10" fill="#475569">重新规划大纲 → 重生成全部</text>

  <text x="590" y="690" font-size="11" font-weight="600" fill="#5B21B6">路由:</text>
  <text x="590" y="706" font-size="10" fill="#475569">→ generate_presentation_plan 节点</text>

  <!-- ================================================================== -->
  <!-- 路由分支 4: ambiguous -->
  <!-- ================================================================== -->
  <line x1="695" y1="475" x2="910" y2="475" stroke="#EF4444" stroke-width="2"/>
  <line x1="910" y1="475" x2="910" y2="600" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="845" y="604" width="240" height="108" rx="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2" filter="url(#shadow)"/>
  <rect x="845" y="604" width="240" height="30" rx="12" fill="#EF4444"/>
  <rect x="845" y="626" width="240" height="8" fill="#EF4444"/>
  <text x="965" y="626" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">ambiguous — 意图不清</text>

  <text x="865" y="652" font-size="11" font-weight="600" fill="#DC2626">目标:</text>
  <text x="865" y="668" font-size="10" fill="#475569">请用户重新描述修改意图</text>

  <text x="865" y="690" font-size="11" font-weight="600" fill="#DC2626">路由:</text>
  <text x="865" y="706" font-size="10" fill="#475569">→ review_pptx_design (自循环)</text>

  <!-- 自循环箭头回到顶部 -->
  <path d="M 1085,660 Q 1150,660 1150,400 Q 1150,130 400,130" fill="none" stroke="#EF4444" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="1160" y="400" font-size="9" fill="#EF4444" transform="rotate(-90,1160,400)">re-prompt 不消耗 retry</text>

  <!-- ================================================================== -->
  <!-- Pydantic model_validator 标注 -->
  <!-- ================================================================== -->
  <rect x="50" y="438" width="260" height="36" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <text x="60" y="453" font-size="9" font-weight="600" fill="#92400E">@model_validator 安全校验:</text>
  <text x="60" y="468" font-size="9" fill="#B45309">scope="local" 但 target_pages=[] → 降级为 "ambiguous"</text>
</svg>