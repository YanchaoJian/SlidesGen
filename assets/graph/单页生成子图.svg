<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#475569">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#DC2626">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-amber" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#D97706">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
  </defs>

  <rect width="860" height="420" fill="#FAFBFE" rx="6"/>

  <!-- 标题 -->
  <text x="430" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">单页幻灯片生成子图 (Slide Subgraph)</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#64748B">每页 Slide 独立运行 · SVG 生成 → 验证/优化 → 设计检查 · 含双重重试循环</text>

  <!-- 外框：子图边界 -->
  <rect x="25" y="55" width="775" height="275" rx="14" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
  <text x="40" y="73" font-size="11" font-weight="600" fill="#059669">SlideState 子图 (compiled subgraph)</text>

  <!-- ================================================================== -->
  <!-- 上半区域：构建与优化阶段 (向右流) -->
  <!-- ================================================================== -->
  
  <!-- START -->
  <circle cx="70" cy="140" r="16" fill="#1E293B"/>
  <text x="70" y="144" text-anchor="middle" font-size="9" font-weight="700" fill="#FFF">START</text>
  <line x1="86" y1="140" x2="105" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Node 1: expand_slide_plan -->
  <rect x="110" y="116" width="145" height="48" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="182" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#5B21B6">expand_slide_plan</text>
  <text x="182" y="152" text-anchor="middle" font-size="9" fill="#7C3AED">大纲扩展 · LLM 细化</text>

  <!-- Node 1 输入组合框 -->
  <rect x="110" y="75" width="145" height="30" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="182" y="87" text-anchor="middle" font-size="8" fill="#64748B">输入: slide_plan + style_...</text>
  <text x="182" y="98" text-anchor="middle" font-size="8" fill="#94A3B8">输出: slide_detail</text>

  <line x1="255" y1="140" x2="280" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Node 2: generate_slide_svg -->
  <rect x="285" y="116" width="145" height="48" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="357" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">generate_slide_svg</text>
  <text x="357" y="152" text-anchor="middle" font-size="9" fill="#059669">LLM 生成 SVG 代码</text>

  <line x1="430" y1="140" x2="455" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Node 3: optimize_svg_crap -->
  <rect x="460" y="105" width="160" height="70" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="540" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">optimize_svg_crap</text>
  <line x1="475" y1="131" x2="605" y2="131" stroke="#D97706" stroke-width="0.8" opacity="0.4"/>
  <text x="540" y="144" text-anchor="middle" font-size="9" fill="#B45309">① XML 验证 + 特性检查</text>
  <text x="540" y="156" text-anchor="middle" font-size="9" fill="#B45309">② 几何越界/重叠检测</text>
  <text x="540" y="168" text-anchor="middle" font-size="9" fill="#B45309" font-style="italic">③ CRAP 设计原则优化</text>

  <line x1="620" y1="140" x2="645" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 条件路由 1 (验证) -->
  <polygon points="680,115 710,140 680,165 650,140" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="680" y="137" text-anchor="middle" font-size="9" font-weight="600" fill="#92400E">验证</text>
  <text x="680" y="148" text-anchor="middle" font-size="9" font-weight="600" fill="#92400E">通过?</text>

  <!-- 验证通过 -> 向下流转 -->
  <line x1="680" y1="165" x2="680" y2="232" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="698" y="200" font-size="9" fill="#059669" font-weight="600">通过 ✓</text>

  <!-- 验证不通过 -> 向上拱形重试至 generate -->
  <path d="M 680,115 Q 680,75 530,75 L 440,75 Q 357,75 357,110" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <rect x="450" y="60" width="130" height="30" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="515" y="73" text-anchor="middle" font-size="9" font-weight="600" fill="#DC2626">SVG 验证重试循环</text>
  <text x="515" y="85" text-anchor="middle" font-size="8" fill="#EF4444">retry_count &lt; llm_max_retries</text>

  <!-- 验证超限 -> 放弃 -->
  <line x1="710" y1="140" x2="735" y2="140" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-red)"/>
  <circle cx="752" cy="140" r="12" fill="#1E293B"/>
  <text x="752" y="143" text-anchor="middle" font-size="8" fill="#FFF">END</text>
  <text x="752" y="162" text-anchor="middle" font-size="9" fill="#94A3B8">放弃这页</text>

  <!-- ================================================================== -->
  <!-- 下半区域：设计检查阶段 (向左流) -->
  <!-- ================================================================== -->

  <!-- Node 4: check_slide_design -->
  <rect x="605" y="240" width="150" height="48" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="680" y="261" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">check_slide_design</text>
  <text x="680" y="276" text-anchor="middle" font-size="9" fill="#3B82F6">VLM 视觉设计评审</text>

  <line x1="605" y1="264" x2="580" y2="264" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 条件路由 2 (设计) -->
  <polygon points="545,239 575,264 545,289 515,264" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="545" y="261" text-anchor="middle" font-size="9" font-weight="600" fill="#1E40AF">设计</text>
  <text x="545" y="272" text-anchor="middle" font-size="9" font-weight="600" fill="#1E40AF">合格?</text>

  <!-- 审查不通过 -> 向上拱形重试至 generate -->
  <path d="M 545,239 Q 545,200 480,200 L 420,200 Q 357,200 357,170" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <rect x="410" y="185" width="130" height="30" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="475" y="198" text-anchor="middle" font-size="9" font-weight="600" fill="#DC2626">设计审查重试循环</text>
  <text x="475" y="210" text-anchor="middle" font-size="8" fill="#EF4444">retry_count &lt; llm_max_retries</text>

  <!-- 审查合格 -> 结束 -->
  <line x1="515" y1="264" x2="442" y2="264" stroke="#059669" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="478" y="258" text-anchor="middle" font-size="9" fill="#059669">合格 ✓</text>

  <!-- 审查超限 -> 结束并接受末版 -->
  <path d="M 545,289 L 545,305 L 420,305 L 420,288" fill="none" stroke="#D97706" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-amber)"/>
  <text x="482" y="300" text-anchor="middle" font-size="8" fill="#D97706">超限 · 接受末版</text>

  <!-- MAIN END Node -->
  <circle cx="420" cy="264" r="18" fill="#1E293B"/>
  <circle cx="420" cy="264" r="14" fill="none" stroke="#FFF" stroke-width="2"/>
  <text x="420" y="268" text-anchor="middle" font-size="10" font-weight="700" fill="#FFF">END</text>

  <!-- ================================================================== -->
  <!-- 底部补充说明区域（并排展示以省空间） -->
  <!-- ================================================================== -->
  
  <!-- 输出标注 -->
  <rect x="30" y="335" width="365" height="55" rx="8" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1"/>
  <text x="45" y="353" font-size="10" font-weight="600" fill="#065F46">子图输出返回</text>
  <text x="45" y="368" font-size="9" fill="#059669">1. generated_slide_paths  |  2. slide_reports (冒泡汇总到主图)</text>
  <text x="45" y="380" font-size="9" fill="#64748B">注: LangGraph 主图中通过 Reducer (_merge_slide_paths) 归并结果</text>

  <!-- 执行策略标注 -->
  <rect x="410" y="335" width="385" height="55" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="425" y="353" font-size="10" font-weight="600" fill="#334155">重试策略说明</text>
  <text x="425" y="368" font-size="9" fill="#64748B">• 统一重试上限: --llm_max_retries (默认 3)</text>
  <text x="425" y="380" font-size="9" fill="#64748B">• SVG 验证失败与 VLM 设计审查不合格，均累加 / 共享同一个重试计数器</text>

</svg>