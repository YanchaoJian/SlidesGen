<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#475569">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-teal" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#0891B2">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <linearGradient id="pipe-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="50%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="520" fill="#FAFBFE" rx="6"/>

  <!-- 标题 -->
  <text x="640" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">SVG 后处理流水线</text>
  <text x="640" y="54" text-anchor="middle" font-size="12" fill="#64748B">SVG Finalization Pipeline — from raw LLM output to DrawingML-ready SVG</text>

  <!-- 流水线进度条背景 -->
  <rect x="60" y="74" width="1160" height="8" rx="4" fill="#F1F5F9"/>
  <rect x="60" y="74" width="1160" height="8" rx="4" fill="url(#pipe-grad)" opacity="0.6"/>

  <!-- ================================================================== -->
  <!-- 阶段 0: 输入 -->
  <!-- ================================================================== -->
  <rect x="50" y="100" width="140" height="60" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="120" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">LLM 原始 SVG</text>
  <text x="120" y="144" text-anchor="middle" font-size="10" fill="#64748B">svg_code (string)</text>

  <line x1="190" y1="130" x2="220" y2="130" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ================================================================== -->
  <!-- 阶段 1: XML 验证 -->
  <!-- ================================================================== -->
  <rect x="225" y="96" width="145" height="68" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="298" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">validate_svg</text>
  <text x="298" y="136" text-anchor="middle" font-size="9" fill="#3B82F6">XML 格式验证</text>
  <text x="298" y="150" text-anchor="middle" font-size="9" fill="#3B82F6">15 项禁用特性检查</text>

  <line x1="370" y1="130" x2="400" y2="130" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ================================================================== -->
  <!-- 阶段 2: 几何检查 -->
  <!-- ================================================================== -->
  <rect x="405" y="96" width="145" height="68" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="478" y="120" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">check_geometry</text>
  <text x="478" y="136" text-anchor="middle" font-size="9" fill="#3B82F6">越界检测 (bbox)</text>
  <text x="478" y="150" text-anchor="middle" font-size="9" fill="#3B82F6">元素重叠检测</text>

  <line x1="550" y1="130" x2="580" y2="130" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ================================================================== -->
  <!-- 阶段 3: CRAP 优化 (LLM) -->
  <!-- ================================================================== -->
  <rect x="585" y="96" width="150" height="68" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="116" text-anchor="middle" font-size="11" font-weight="600" fill="#5B21B6">optimize_svg_crap</text>
  <text x="660" y="132" text-anchor="middle" font-size="9" fill="#7C3AED">LLM CRAP 设计优化</text>
  <text x="660" y="146" text-anchor="middle" font-size="9" fill="#7C3AED">对比/重复/对齐/亲密</text>
  <text x="660" y="158" text-anchor="middle" font-size="8" fill="#A78BFA" font-style="italic">Contrast · Repetition · Alignment · Proximity</text>

  <!-- 分界线标注 -->
  <line x1="780" y1="88" x2="780" y2="172" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="780" y="84" text-anchor="middle" font-size="9" fill="#94A3B8" font-weight="500">LLM 阶段结束</text>

  <line x1="735" y1="130" x2="800" y2="130" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ================================================================== -->
  <!-- finalize_single_svg 大框 -->
  <!-- ================================================================== -->
  <rect x="48" y="200" width="1184" height="300" rx="12" fill="#FEFEFE" stroke="#0891B2" stroke-width="1.8" stroke-dasharray="8,4"/>
  <text x="640" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#0E7490">finalize_single_svg — 后处理管线 (原地修改文件)</text>
  <text x="640" y="242" text-anchor="middle" font-size="11" fill="#64748B">pipeline/svg_finalize/ 子模块 · 按顺序执行 · 每步独立容错</text>

  <!-- Step 0: strip_background -->
  <rect x="72" y="262" width="148" height="80" rx="8" fill="#F0FDFA" stroke="#0891B2" stroke-width="1.3" filter="url(#shadow)"/>
  <rect x="72" y="262" width="148" height="22" rx="8" fill="#0891B2"/>
  <rect x="72" y="278" width="148" height="2" fill="#0891B2"/>
  <text x="146" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#FFF">Step 0</text>
  <text x="146" y="300" text-anchor="middle" font-size="10" font-weight="600" fill="#0E7490">strip_background</text>
  <text x="146" y="316" text-anchor="middle" font-size="9" fill="#64748B">移除全画布背景矩形</text>
  <text x="146" y="330" text-anchor="middle" font-size="8" fill="#94A3B8">母版提供背景</text>

  <line x1="220" y1="302" x2="238" y2="302" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arr-teal)"/>

  <!-- Step 1: embed_icons -->
  <rect x="242" y="262" width="138" height="80" rx="8" fill="#F0FDFA" stroke="#0891B2" stroke-width="1.3" filter="url(#shadow)"/>
  <rect x="242" y="262" width="138" height="22" rx="8" fill="#0891B2"/>
  <rect x="242" y="278" width="138" height="2" fill="#0891B2"/>
  <text x="311" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#FFF">Step 1</text>
  <text x="311" y="300" text-anchor="middle" font-size="10" font-weight="600" fill="#0E7490">embed_icons</text>
  <text x="311" y="316" text-anchor="middle" font-size="9" fill="#64748B">内联 &lt;use&gt; 引用的</text>
  <text x="311" y="330" text-anchor="middle" font-size="9" fill="#64748B">SVG 图标文件</text>

  <line x1="380" y1="302" x2="398" y2="302" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arr-teal)"/>

  <!-- Step 2: crop_images -->
  <rect x="402" y="262" width="138" height="80" rx="8" fill="#F0FDFA" stroke="#0891B2" stroke-width="1.3" filter="url(#shadow)"/>
  <rect x="402" y="262" width="138" height="22" rx="8" fill="#0891B2"/>
  <rect x="402" y="278" width="138" height="2" fill="#0891B2"/>
  <text x="471" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#FFF">Step 2</text>
  <text x="471" y="300" text-anchor="middle" font-size="10" font-weight="600" fill="#0E7490">crop_images</text>
  <text x="471" y="316" text-anchor="middle" font-size="9" fill="#64748B">裁剪 slice 模式</text>
  <text x="471" y="330" text-anchor="middle" font-size="9" fill="#64748B">图片至视口尺寸</text>

  <line x1="540" y1="302" x2="558" y2="302" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arr-teal)"/>

  <!-- Step 3: fix_image_aspect -->
  <rect x="562" y="262" width="138" height="80" rx="8" fill="#F0FDFA" stroke="#0891B2" stroke-width="1.3" filter="url(#shadow)"/>
  <rect x="562" y="262" width="138" height="22" rx="8" fill="#0891B2"/>
  <rect x="562" y="278" width="138" height="2" fill="#0891B2"/>
  <text x="631" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#FFF">Step 3</text>
  <text x="631" y="300" text-anchor="middle" font-size="10" font-weight="600" fill="#0E7490">fix_image_aspect</text>
  <text x="631" y="316" text-anchor="middle" font-size="9" fill="#64748B">修复图片宽高比</text>
  <text x="631" y="330" text-anchor="middle" font-size="9" fill="#64748B">防 PPTX 拉伸</text>

  <line x1="700" y1="302" x2="718" y2="302" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arr-teal)"/>

  <!-- Step 4: embed_images -->
  <rect x="722" y="262" width="138" height="80" rx="8" fill="#F0FDFA" stroke="#0891B2" stroke-width="1.3" filter="url(#shadow)"/>
  <rect x="722" y="262" width="138" height="22" rx="8" fill="#0891B2"/>
  <rect x="722" y="278" width="138" height="2" fill="#0891B2"/>
  <text x="791" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#FFF">Step 4</text>
  <text x="791" y="300" text-anchor="middle" font-size="10" font-weight="600" fill="#0E7490">embed_images</text>
  <text x="791" y="316" text-anchor="middle" font-size="9" fill="#64748B">外部图片 →</text>
  <text x="791" y="330" text-anchor="middle" font-size="9" fill="#64748B">Base64 内嵌</text>

  <line x1="860" y1="302" x2="878" y2="302" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arr-teal)"/>

  <!-- Step 5: flatten_tspan -->
  <rect x="882" y="262" width="138" height="80" rx="8" fill="#F0FDFA" stroke="#0891B2" stroke-width="1.3" filter="url(#shadow)"/>
  <rect x="882" y="262" width="138" height="22" rx="8" fill="#0891B2"/>
  <rect x="882" y="278" width="138" height="2" fill="#0891B2"/>
  <text x="951" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#FFF">Step 5</text>
  <text x="951" y="300" text-anchor="middle" font-size="10" font-weight="600" fill="#0E7490">flatten_tspan</text>
  <text x="951" y="316" text-anchor="middle" font-size="9" fill="#64748B">&lt;tspan&gt; 展平为</text>
  <text x="951" y="330" text-anchor="middle" font-size="9" fill="#64748B">独立 &lt;text&gt; 元素</text>

  <!-- Step 5 → Step 6 (换行) -->
  <line x1="951" y1="342" x2="951" y2="370" stroke="#0891B2" stroke-width="1.5"/>
  <line x1="951" y1="370" x2="146" y2="370" stroke="#0891B2" stroke-width="1"/>
  <line x1="146" y1="370" x2="146" y2="390" stroke="#0891B2" stroke-width="1.5" marker-end="url(#arr-teal)"/>

  <!-- Step 6: svg_rect_to_path -->
  <rect x="72" y="394" width="148" height="80" rx="8" fill="#F0FDFA" stroke="#0891B2" stroke-width="1.3" filter="url(#shadow)"/>
  <rect x="72" y="394" width="148" height="22" rx="8" fill="#0891B2"/>
  <rect x="72" y="410" width="148" height="2" fill="#0891B2"/>
  <text x="146" y="410" text-anchor="middle" font-size="10" font-weight="600" fill="#FFF">Step 6</text>
  <text x="146" y="434" text-anchor="middle" font-size="10" font-weight="600" fill="#0E7490">svg_rect_to_path</text>
  <text x="146" y="450" text-anchor="middle" font-size="9" fill="#64748B">圆角 &lt;rect rx&gt; →</text>
  <text x="146" y="464" text-anchor="middle" font-size="9" fill="#64748B">&lt;path d&gt; 保留圆角</text>

  <!-- 输出 -->
  <line x1="220" y1="434" x2="288" y2="434" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <rect x="293" y="404" width="160" height="60" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="373" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">DrawingML-Ready</text>
  <text x="373" y="446" text-anchor="middle" font-size="10" fill="#059669">SVG → PPTX 转换</text>
  <text x="373" y="458" text-anchor="middle" font-size="9" fill="#64748B">svg_to_pptx/ 模块</text>

  <!-- 阶段 3 输出标注 -->
  <rect x="805" y="100" width="160" height="60" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="885" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#065F46">写入 SVG 文件</text>
  <text x="885" y="142" text-anchor="middle" font-size="10" fill="#059669">slide_v{version}.svg</text>
  <text x="885" y="154" text-anchor="middle" font-size="9" fill="#64748B">→ 进入后处理管线</text>

  <line x1="885" y1="160" x2="885" y2="180" stroke="#475569" stroke-width="1"/>
  <line x1="885" y1="180" x2="640" y2="180" stroke="#475569" stroke-width="1"/>
  <line x1="640" y1="180" x2="640" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 容错标注 -->
  <rect x="550" y="454" width="320" height="36" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <text x="710" y="472" text-anchor="middle" font-size="10" fill="#92400E">每步独立 try/except，单步失败不阻断后续步骤 (graceful degradation)</text>
  <text x="710" y="486" text-anchor="middle" font-size="9" fill="#B45309">失败仅记录 logger.warning，继续执行下一步</text>
</svg>