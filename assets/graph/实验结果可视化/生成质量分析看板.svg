<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="100%" height="100%" style="max-width: 840px;">
  <defs>
    <!-- 阴影滤镜：增加透明度且扩大范围让阴影更柔和，防止截断 -->
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="840" height="520" fill="#f8fafc" rx="12" />

  <!-- 主标题 -->
  <text x="420" y="55" font-family="sans-serif" font-size="26" font-weight="bold" fill="#0f172a" text-anchor="middle">智能排版生成质量分析</text>

  <!-- ================= KPI 面板区 ================= -->
  <!-- 宽度: 4个卡片 x 175 = 700, 3个间距 x 20 = 60, 总宽=760。居中从 x=40 开始 -->
  <g transform="translate(40, 95)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="175" height="100" fill="#ffffff" rx="10" filter="url(#shadow)"/>
    <text x="87.5" y="38" font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="middle">计划幻灯片数</text>
    <text x="87.5" y="78" font-family="sans-serif" font-size="34" font-weight="bold" fill="#0f172a" text-anchor="middle">18</text>

    <!-- KPI 2 -->
    <rect x="195" y="0" width="175" height="100" fill="#ffffff" rx="10" filter="url(#shadow)"/>
    <text x="282.5" y="38" font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="middle">实际产出页数</text>
    <text x="282.5" y="78" font-family="sans-serif" font-size="34" font-weight="bold" fill="#10b981" text-anchor="middle">18</text>

    <!-- KPI 3 -->
    <rect x="390" y="0" width="175" height="100" fill="#ffffff" rx="10" filter="url(#shadow)"/>
    <text x="477.5" y="38" font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="middle">SVG平均重试</text>
    <text x="477.5" y="78" font-family="sans-serif" font-size="34" font-weight="bold" fill="#3b82f6" text-anchor="middle">0.0</text>

    <!-- KPI 4 -->
    <rect x="585" y="0" width="175" height="100" fill="#ffffff" rx="10" filter="url(#shadow)"/>
    <text x="672.5" y="38" font-family="sans-serif" font-size="15" fill="#64748b" text-anchor="middle">设计平均重试</text>
    <text x="672.5" y="78" font-family="sans-serif" font-size="34" font-weight="bold" fill="#f59e0b" text-anchor="middle">1.67</text>
  </g>

  <!-- ================= 核心比率进度条区 ================= -->
  <!-- 下移到 240, 增加高度以容纳标签 -->
  <g transform="translate(40, 240)">
    <!-- 背景框，总宽 760 -->
    <rect x="0" y="0" width="760" height="240" fill="#ffffff" rx="10" filter="url(#shadow)"/>
    
    <!-- 标尺线 (覆盖进度条区域 x: 180 到 680) -->
    <line x1="180" y1="20" x2="180" y2="210" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4" />
    <line x1="305" y1="20" x2="305" y2="210" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4" />
    <line x1="430" y1="20" x2="430" y2="210" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4" />
    <line x1="555" y1="20" x2="555" y2="210" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4" />
    <line x1="680" y1="20" x2="680" y2="210" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4" />

    <text x="180" y="228" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">0%</text>
    <text x="430" y="228" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">50%</text>
    <text x="680" y="228" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">100%</text>

    <!-- 1. SVG首次通过率 (满宽500) -->
    <text x="160" y="50" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="end">SVG 首次通过率</text>
    <rect x="180" y="34" width="500" height="22" fill="#f1f5f9" rx="11"/>
    <rect x="180" y="34" width="500" height="22" fill="#10b981" rx="11"/>
    <text x="695" y="50" font-family="sans-serif" font-size="15" font-weight="bold" fill="#10b981">100%</text>

    <!-- 2. 设计首次通过率 -->
    <text x="160" y="100" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="end">设计排版首次通过</text>
    <rect x="180" y="84" width="500" height="22" fill="#f1f5f9" rx="11"/>
    <rect x="180" y="84" width="83.5" height="22" fill="#ef4444" rx="11"/> <!-- 500 * 0.167 -->
    <text x="695" y="100" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ef4444">16.7%</text>

    <!-- 3. 智能自愈成功率 -->
    <text x="160" y="150" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="end">智能自愈修复成功</text>
    <rect x="180" y="134" width="500" height="22" fill="#f1f5f9" rx="11"/>
    <rect x="180" y="134" width="366.5" height="22" fill="#f59e0b" rx="11"/> <!-- 500 * 0.733 -->
    <text x="695" y="150" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f59e0b">73.3%</text>

    <!-- 4. 整体完成率 -->
    <text x="160" y="200" font-family="sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="end">最终整体完成率</text>
    <rect x="180" y="184" width="500" height="22" fill="#f1f5f9" rx="11"/>
    <rect x="180" y="184" width="500" height="22" fill="#3b82f6" rx="11"/>
    <text x="695" y="200" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3b82f6">100%</text>
  </g>
</svg>
