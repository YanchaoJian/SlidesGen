  <circle cx="458" cy="230" r="3" fill="#D97706"/>
  <text x="478" y="234" font-size="10" fill="#334155">DeepSeek-R1</text>

  <!-- 数据表格 -->
  <rect x="430" y="270" width="170" height="80" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="445" y="288" font-size="9" font-weight="600" fill="#334155">模型</text>
  <text x="520" y="288" text-anchor="middle" font-size="9" font-weight="600" fill="#1E40AF">D1</text>
  <text x="555" y="288" text-anchor="middle" font-size="9" font-weight="600" fill="#059669">D2</text>
  <text x="590" y="288" text-anchor="middle" font-size="9" font-weight="600" fill="#D97706">D3</text>
  <line x1="440" y1="294" x2="592" y2="294" stroke="#E2E8F0" stroke-width="1"/>
  <text x="445" y="308" font-size="9" fill="#3B82F6">GPT-4o</text>
  <text x="520" y="308" text-anchor="middle" font-size="9" fill="#475569">4.2</text>
  <text x="555" y="308" text-anchor="middle" font-size="9" fill="#475569">3.8</text>
  <text x="590" y="308" text-anchor="middle" font-size="9" fill="#475569">3.5</text>
  <text x="445" y="324" font-size="9" fill="#059669">GPT-5-mini</text>
  <text x="520" y="324" text-anchor="middle" font-size="9" fill="#475569">4.5</text>
  <text x="555" y="324" text-anchor="middle" font-size="9" fill="#475569">4.0</text>
  <text x="590" y="324" text-anchor="middle" font-size="9" fill="#475569">3.8</text>
  <text x="445" y="340" font-size="9" fill="#D97706">DeepSeek-R1</text>
  <text x="520" y="340" text-anchor="middle" font-size="9" fill="#475569">3.6</text>
  <text x="555" y="340" text-anchor="middle" font-size="9" fill="#475569">3.2</text>
  <text x="590" y="340" text-anchor="middle" font-size="9" fill="#475569">2.8</text>

  <text x="330" y="400" text-anchor="middle" font-size="9" fill="#EF4444" font-style="italic">* 以上为示例数据，请替换为实际实验结果</text>

