<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1280" height="780" fill="#FAFBFE" rx="6"/>

  <!-- 标题 -->
  <text x="640" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">实验结果可视化模板</text>
  <text x="640" y="54" text-anchor="middle" font-size="12" fill="#64748B">Experimental Results Template — 请替换为实际实验数据 (示例数据仅供参考)</text>

  <!-- ================================================================== -->
  <!-- 左上：雷达图 (模型对比) -->
  <!-- ================================================================== -->
  <rect x="40" y="72" width="580" height="340" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#1E293B">多模型评估分数雷达图</text>
  <text x="330" y="112" text-anchor="middle" font-size="10" fill="#94A3B8">Radar Chart — 各模型在三个维度上的对比 (0-5)</text>

  <!-- 雷达图网格 (五边形简化为正三角+两个维度) -->
  <!-- 使用三角形雷达：D1(上), D2(左下), D3(右下) -->
  <!-- 中心点: (280, 260), 半径: 110 -->
  <!-- D1(Content): 上方 (280, 150) -->
  <!-- D2(Design): 左下 (185, 315) -->
  <!-- D3(Style): 右下 (375, 315) -->

  <!-- 网格线 - 5级同心三角 -->
  <!-- Level 1 (1/5) -->
  <polygon points="280,238 261,249 299,249" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
  <!-- Level 2 (2/5) -->
  <polygon points="280,216 242,260 318,260" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
  <!-- Level 3 (3/5) -->
  <polygon points="280,194 223,271 337,271" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
  <!-- Level 4 (4/5) -->
  <polygon points="280,172 204,282 356,282" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
  <!-- Level 5 (5/5) 外框 -->
  <polygon points="280,150 185,293 375,293" fill="none" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- 轴线 -->
  <line x1="280" y1="260" x2="280" y2="150" stroke="#CBD5E1" stroke-width="0.8"/>
  <line x1="280" y1="260" x2="185" y2="293" stroke="#CBD5E1" stroke-width="0.8"/>
  <line x1="280" y1="260" x2="375" y2="293" stroke="#CBD5E1" stroke-width="0.8"/>

  <!-- 维度标签 -->
  <text x="280" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#1E40AF">D1 内容</text>
  <text x="168" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">D2 设计</text>
  <text x="392" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#D97706">D3 风格</text>

  <!-- 刻度标签 -->
  <text x="268" y="240" font-size="8" fill="#94A3B8">1</text>
  <text x="268" y="218" font-size="8" fill="#94A3B8">2</text>
  <text x="268" y="196" font-size="8" fill="#94A3B8">3</text>
  <text x="268" y="174" font-size="8" fill="#94A3B8">4</text>
  <text x="268" y="152" font-size="8" fill="#94A3B8">5</text>

  <!-- 模型 A 数据 (GPT-4o): D1=4.2, D2=3.8, D3=3.5 -->
  <!-- D1: 4.2/5 * 110 = 92.4, y=260-92.4=167.6 -->
  <!-- D2: 3.8/5 → (280-72.2, 260+41.8) = (207.8, 285.3) -->
  <!-- D3: 3.5/5 → (280+66.5, 260+38.5) = (346.5, 283.1) -->
  <polygon points="280,168 208,285 347,283" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="280" cy="168" r="4" fill="#3B82F6"/>
  <circle cx="208" cy="285" r="4" fill="#3B82F6"/>
  <circle cx="347" cy="283" r="4" fill="#3B82F6"/>

  <!-- 模型 B 数据 (GPT-5-mini): D1=4.5, D2=4.0, D3=3.8 -->
  <polygon points="280,161 213,278 353,279" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="2"/>
  <circle cx="280" cy="161" r="4" fill="#059669"/>
  <circle cx="213" cy="278" r="4" fill="#059669"/>
  <circle cx="353" cy="279" r="4" fill="#059669"/>

  <!-- 模型 C 数据 (DeepSeek-R1): D1=3.6, D2=3.2, D3=2.8 -->
  <polygon points="280,181 221,289 333,290" fill="#D97706" fill-opacity="0.12" stroke="#D97706" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="280" cy="181" r="4" fill="#D97706"/>
  <circle cx="221" cy="289" r="4" fill="#D97706"/>
  <circle cx="333" cy="290" r="4" fill="#D97706"/>

  <!-- 图例 -->
  <rect x="430" y="160" width="170" height="90" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="445" y1="182" x2="470" y2="182" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="458" cy="182" r="3" fill="#3B82F6"/>
  <text x="478" y="186" font-size="10" fill="#334155">GPT-4o</text>

  <line x1="445" y1="206" x2="470" y2="206" stroke="#059669" stroke-width="2"/>
  <circle cx="458" cy="206" r="3" fill="#059669"/>
  <text x="478" y="210" font-size="10" fill="#334155">GPT-5-mini</text>

