<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 750" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.10"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#475569">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#059669">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-purple" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#7C3AED">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto" fill="#D97706">
      <polygon points="0 0, 9 3, 0 6"/>
    </marker>
  </defs>

  <rect width="1280" height="750" fill="#FAFBFE" rx="6"/>

  <!-- 标题 -->
  <text x="640" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1E293B">状态管理与 Map-Reduce 数据流</text>
  <text x="640" y="54" text-anchor="middle" font-size="12" fill="#64748B">State Management — OverallState / SlideState / Send() Fan-out / Custom Reducers</text>

  <!-- ================================================================== -->
  <!-- OverallState 大框 -->
  <!-- ================================================================== -->
  <rect x="40" y="78" width="540" height="520" rx="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="40" y="78" width="540" height="38" rx="14" fill="#3B82F6"/>
  <rect x="40" y="102" width="540" height="14" fill="#3B82F6"/>
  <text x="310" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">OverallState (主图全局状态)</text>

  <!-- 感知层 -->
  <rect x="60" y="128" width="500" height="52" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="76" y="146" font-size="11" font-weight="600" fill="#1E40AF">感知层产物</text>
  <text x="76" y="164" font-size="10" fill="#475569">content: Optional[Dict]</text>
  <text x="310" y="164" font-size="10" fill="#475569">style_protocol: Optional[str]</text>

  <!-- 审查循环 ReviewCycle -->
  <rect x="60" y="188" width="500" height="52" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="76" y="206" font-size="11" font-weight="600" fill="#DC2626">审查循环 (ReviewCycle × 3)</text>
  <text x="76" y="224" font-size="10" fill="#475569">style_review</text>
  <text x="220" y="224" font-size="10" fill="#475569">plan_review</text>
  <text x="360" y="224" font-size="10" fill="#475569">pptx_review</text>

  <!-- ReviewCycle 展开 -->
  <rect x="60" y="248" width="245" height="62" rx="8" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
  <text x="76" y="266" font-size="10" font-weight="600" fill="#92400E">ReviewCycle (TypedDict)</text>
  <text x="76" y="282" font-size="10" fill="#475569" font-family="Consolas, monospace">verified: bool</text>
  <text x="76" y="296" font-size="10" fill="#475569" font-family="Consolas, monospace">retry_count: int</text>
  <text x="210" y="296" font-size="10" fill="#475569" font-family="Consolas, monospace">critique: Optional[str]</text>

  <!-- 规划层 -->
  <rect x="60" y="320" width="500" height="52" rx="8" fill="#EDE9FE" stroke="#DDD6FE" stroke-width="1"/>
  <text x="76" y="338" font-size="11" font-weight="600" fill="#5B21B6">规划层产物</text>
  <text x="76" y="356" font-size="10" fill="#475569">presentation_plan: Optional[List[Dict]]</text>
  <text x="370" y="356" font-size="10" fill="#475569">main_content: Optional[Dict]</text>

  <!-- 执行层 (Reducer 字段) — 重点突出 -->
  <rect x="60" y="380" width="500" height="90" rx="8" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="76" y="398" font-size="11" font-weight="700" fill="#065F46">执行层产物 (带自定义 Reducer)</text>

  <rect x="76" y="406" width="468" height="24" rx="4" fill="#D1FAE5"/>
  <text x="86" y="422" font-size="10" fill="#065F46" font-family="Consolas, monospace">generated_slide_paths: Annotated[Dict[int, str], _merge_slide_paths]</text>

  <rect x="76" y="436" width="468" height="24" rx="4" fill="#D1FAE5"/>
  <text x="86" y="452" font-size="10" fill="#065F46" font-family="Consolas, monospace">slide_reports: Annotated[Dict[int, SlideReport], _merge_slide_reports]</text>

  <!-- 交付层 -->
  <rect x="60" y="478" width="500" height="52" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="76" y="496" font-size="11" font-weight="600" fill="#92400E">交付层产物</text>
  <text x="76" y="514" font-size="10" fill="#475569">final_pptx_path</text>
  <text x="220" y="514" font-size="10" fill="#475569">pptx_feedback_scope</text>
  <text x="410" y="514" font-size="10" fill="#475569">retry_slide_pages</text>

  <!-- 反馈范围展开 -->
  <rect x="60" y="538" width="245" height="48" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
  <text x="76" y="556" font-size="10" font-weight="600" fill="#92400E">pptx_feedback_scope 取值</text>
  <text x="76" y="572" font-size="9" fill="#B45309" font-family="Consolas, monospace">"local" | "global_style" | "global_plan" | "ambiguous"</text>

  <!-- ================================================================== -->
  <!-- SlideState 大框 -->
  <!-- ================================================================== -->
  <rect x="700" y="78" width="540" height="410" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="700" y="78" width="540" height="38" rx="14" fill="#059669"/>
  <rect x="700" y="102" width="540" height="14" fill="#059669"/>
  <text x="970" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">SlideState (单页子图状态)</text>

  <!-- 任务标识 -->
  <rect x="720" y="128" width="500" height="36" rx="8" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1"/>
  <text x="736" y="150" font-size="11" font-weight="600" fill="#065F46">任务标识</text>
  <text x="850" y="150" font-size="10" fill="#475569">slide_page: int</text>
  <text x="1020" y="150" font-size="10" fill="#475569">total_pages: int</text>

  <!-- 任务输入 -->
  <rect x="720" y="172" width="500" height="44" rx="8" fill="#EDE9FE" stroke="#DDD6FE" stroke-width="1"/>
  <text x="736" y="190" font-size="11" font-weight="600" fill="#5B21B6">任务输入 (由主图分发)</text>
  <text x="736" y="206" font-size="10" fill="#475569">slide_plan: Dict</text>
  <text x="940" y="206" font-size="10" fill="#475569">slide_style_protocol: str</text>

  <!-- 运行状态 -->
  <rect x="720" y="224" width="500" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="736" y="242" font-size="11" font-weight="600" fill="#334155">运行状态</text>
  <text x="736" y="260" font-size="10" fill="#475569">slide_detail: Optional[str]</text>
  <text x="736" y="276" font-size="10" fill="#475569">svg_code: Optional[str]</text>
  <text x="960" y="260" font-size="10" fill="#475569">svg_path: Optional[str]</text>
  <text x="960" y="276" font-size="10" fill="#475569">error_log: Optional[str]</text>

  <!-- 审查循环 -->
  <rect x="720" y="292" width="500" height="36" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="736" y="314" font-size="11" font-weight="600" fill="#DC2626">审查循环</text>
  <text x="870" y="314" font-size="10" fill="#475569">svg_review: ReviewCycle</text>
  <text x="1070" y="314" font-size="10" fill="#475569">design_review</text>

  <!-- 输出 (冒泡字段) -->
  <rect x="720" y="336" width="500" height="60" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="736" y="356" font-size="11" font-weight="700" fill="#065F46">输出 (冒泡到 OverallState)</text>
  <text x="736" y="374" font-size="10" fill="#475569" font-family="Consolas, monospace">generated_slide_paths: Dict[int, str]</text>
  <text x="736" y="390" font-size="10" fill="#475569" font-family="Consolas, monospace">slide_reports: Dict[int, SlideReport]</text>

  <!-- ================================================================== -->
  <!-- Send() Fan-out 示意 -->
  <!-- ================================================================== -->
  <rect x="700" y="510" width="540" height="220" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
  <rect x="700" y="510" width="540" height="34" rx="14" fill="#7C3AED"/>
  <rect x="700" y="534" width="540" height="10" fill="#7C3AED"/>
  <text x="970" y="534" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Send() Map-Reduce 并行模式</text>

  <!-- OverallState 起点 -->
  <rect x="730" y="560" width="130" height="40" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="795" y="584" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">OverallState</text>

  <!-- 箭头到 dispatch -->
  <line x1="860" y1="580" x2="900" y2="580" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- dispatch -->
  <rect x="905" y="560" width="120" height="40" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="965" y="577" text-anchor="middle" font-size="10" font-weight="600" fill="#5B21B6">dispatch</text>
  <text x="965" y="592" text-anchor="middle" font-size="9" fill="#7C3AED">map_slides_to_tasks</text>

  <!-- Fan-out 箭头 -->
  <line x1="965" y1="600" x2="965" y2="618" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="965" y1="618" x2="780" y2="618" stroke="#7C3AED" stroke-width="1"/>
  <line x1="965" y1="618" x2="1150" y2="618" stroke="#7C3AED" stroke-width="1"/>

  <line x1="780" y1="618" x2="780" y2="636" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <line x1="965" y1="618" x2="965" y2="636" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <line x1="1150" y1="618" x2="1150" y2="636" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-purple)"/>

  <!-- SlideState 实例 -->
  <rect x="730" y="640" width="100" height="30" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
  <text x="780" y="659" text-anchor="middle" font-size="10" font-weight="600" fill="#065F46">SlideState₁</text>

  <rect x="915" y="640" width="100" height="30" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
  <text x="965" y="659" text-anchor="middle" font-size="10" font-weight="600" fill="#065F46">SlideState₂</text>

  <rect x="1100" y="640" width="100" height="30" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
  <text x="1150" y="659" text-anchor="middle" font-size="10" font-weight="600" fill="#065F46">SlideStateₙ</text>

  <text x="860" y="658" text-anchor="middle" font-size="14" fill="#94A3B8">···</text>
  <text x="1045" y="658" text-anchor="middle" font-size="14" fill="#94A3B8">···</text>

  <!-- Fan-in 汇合 -->
  <line x1="780" y1="670" x2="780" y2="690" stroke="#059669" stroke-width="1"/>
  <line x1="965" y1="670" x2="965" y2="690" stroke="#059669" stroke-width="1"/>
  <line x1="1150" y1="670" x2="1150" y2="690" stroke="#059669" stroke-width="1"/>
  <line x1="780" y1="690" x2="1150" y2="690" stroke="#059669" stroke-width="1.5"/>
  <line x1="965" y1="690" x2="965" y2="710" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Reducer 合并 -->
  <rect x="885" y="714" width="160" height="20" rx="4" fill="#F0FDF4" stroke="#A7F3D0" stroke-width="1"/>
  <text x="965" y="728" text-anchor="middle" font-size="9" font-weight="600" fill="#059669">Reducer: _merge_slide_paths 合并</text>

  <!-- Send() 标注 -->
  <text x="1055" y="612" font-size="9" fill="#7C3AED" font-style="italic">Send("generate_single_slide", SlideState)</text>

  <!-- ================================================================== -->
  <!-- Reducer 详解框 -->
  <!-- ================================================================== -->
  <rect x="40" y="608" width="540" height="125" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="608" width="540" height="32" rx="12" fill="#D97706"/>
  <rect x="40" y="632" width="540" height="8" fill="#D97706"/>
  <text x="310" y="632" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">自定义 Reducer 机制</text>

  <!-- _merge_slide_paths -->
  <rect x="60" y="650" width="250" height="70" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="76" y="668" font-size="11" font-weight="600" fill="#92400E">_merge_slide_paths</text>
  <text x="76" y="686" font-size="9" fill="#64748B">按 slide_page 合并 Dict[int, str]</text>
  <text x="76" y="700" font-size="9" fill="#64748B">后写入覆盖先写入 (dict.update)</text>
  <text x="76" y="714" font-size="9" fill="#B45309" font-weight="500">→ HITL 局部重生成时自动覆盖旧版</text>

  <!-- _merge_slide_reports -->
  <rect x="320" y="650" width="250" height="70" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
  <text x="336" y="668" font-size="11" font-weight="600" fill="#92400E">_merge_slide_reports</text>
  <text x="336" y="686" font-size="9" fill="#64748B">按 slide_page 合并 SlideReport</text>
  <text x="336" y="700" font-size="9" fill="#64748B">子图审查数据冒泡到主图</text>
  <text x="336" y="714" font-size="9" fill="#B45309" font-weight="500">→ 供 final_snapshot.json 持久化</text>
</svg>