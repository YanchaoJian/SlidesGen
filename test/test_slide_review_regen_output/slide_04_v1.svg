<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1280" height="10" fill="#003F87"/>

  <!-- Title -->
  <text x="80" y="80" font-family="Arial, Microsoft YaHei, sans-serif" font-size="39" font-weight="bold" fill="#003F87" text-anchor="start">
    Technical Approach: Transformer Architecture
  </text>

  <!-- Separator Line -->
  <line x1="80" y1="100" x2="1200" y2="100" stroke="#CCCCCC" stroke-width="1"/>

  <!-- Left Text Area -->
  <text x="100" y="160" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="normal" fill="#333333" text-anchor="start">
    <tspan x="100" dy="0">The Transformer consists of an encoder-decoder structure using</tspan>
    <tspan x="100" dy="2em">stacked self-attention and point-wise, fully connected layers.</tspan>
  </text>
  <text x="100" y="260" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="normal" fill="#333333" text-anchor="start">
    <tspan x="100" dy="0">Key components include multi-head attention, scaled dot-product</tspan>
    <tspan x="100" dy="2em">attention, and position-wise feed-forward networks.</tspan>
  </text>
  <text x="100" y="360" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="normal" fill="#333333" text-anchor="start">
    <tspan x="100" dy="0">Positional encodings are used to inject sequence order</tspan>
    <tspan x="100" dy="2em">information.</tspan>
  </text>

  <!-- Right Visual Area -->
  <!-- White Card Backing -->
  <rect x="850" y="148" width="424" height="324" rx="8" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
  <!-- Image -->
  <image href="S:\project\SlidesGen\test\test_pdf_parser_output\images\_page_3_Figure_0.jpeg" x="862" y="160" width="400" height="300" preserveAspectRatio="xMidYMid meet"/>
  <!-- Caption -->
  <text x="850" y="470" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="normal" fill="#666666" text-anchor="start">
    (left) Scaled Dot-Product Attention. (right) Multi-Head Attention consists of several attention layers running in parallel.
  </text>

